# CLAIMS_REGISTRY.yaml — Public claim governance (blueprint §72; program §44)
#
# MOVED 2026-09-11. This file lived in `D:\CodexProjects\uskc-lanes\gtm\CLAIMS_REGISTRY.yaml`,
# outside the site repository, where nothing that ships could read it and nothing in CI could
# fail when it went stale. It now lives beside the code it governs; `MOVED_TO.md` in the old
# directory points here, and the old copy must not be edited again. There is one registry.
#
# Every quantitative or capability claim live in the site copy read for the 2026-09-08 lane:
# /, /knowledge-compiler, /pricing, /security, /sources, /developers, /benchmarks, /evidence,
# /research, /research/notes, /trust — plus the five 2026-09-11 rows listed under RE-ALIGNMENT.
#
# Site repo: `0ssol1620-byte/tavonel-saas-foundation`. Paths in `artifact` are relative to that
# repository's root unless they name a drive.
#
# ---------------------------------------------------------------------------------------------
# Fields (2026-09-08: program §44 names ten; the first revision of this file carried six)
#
#   claimId                The stable id a page, a cookbook record or a report cites. Assigned
#                          2026-09-11 in file order, CLM-001..CLM-049, and never reused: a
#                          retired claim keeps its id so a citation to it can still be resolved.
#   claim                  The sentence as a reader meets it, quoted or closely paraphrased.
#   surface                Where it is said.
#   evidence               What makes it true — the code, constant or decision behind it.
#   artifact               The file an auditor opens to check it, or `none` with the reason.
#                          `none` is not a defect on a copy claim; it is a defect on a number.
#   runtime                Which running thing the claim describes. A claim derived from a
#                          constant is true of any deployment; a claim about an activation gate
#                          is true of this one and stops being true when the gate moves.
#   scope                  What the claim covers.
#   limitations            What it does not say. The half a reader supplies for themselves if
#                          nobody writes it down.
#   status                 §72's five: DRAFT / SUPPORTED / QUALIFIED / RESTRICTED / RETIRED.
#   public_private         PUBLIC — may be said on a public page.
#                          RESTRICTED_MECHANISM — describes a technology on the disclosure
#                          registry's publication freeze; needs IP review before it is said.
#                          INTERNAL — not for a public surface in any form.
#   ip_disclosure_review_required   Present and `true` only where a founder/IP review gates it.
#   owner                  Who keeps this row true day to day. Per CLAUDE.md, what a public claim
#                          says and whether evidence supports it is always the founder's call;
#                          `engineering` here means the row is derived from a constant and pinned
#                          by a named test, so drift fails a build rather than waiting for a read.
#   expiry_or_revalidation The event that invalidates it, not only a date. A date alone expires
#                          on a calendar; a claim expires when the thing under it moves.
#   supportedBuild         The commit this row was last checked against. `38d957d` means a lane
#                          opened the artifact at that HEAD; `3157ee5` means the row was written
#                          on 2026-09-08 and has not been re-read since. It is a record of the
#                          last check, never an assertion that the row is still true.
#   lastVerifiedAt         The day of that check. Moved by a person or a lane that actually read
#                          the artifact — never by a rebase, a reformat or a copy.
#   review_date            Standing cadence. K-03: every row still carries the same placeholder,
#                          because no cadence has been set. That is a founder item, and a uniform
#                          date is recorded here as the absence of a cadence rather than as one.
#
# Blueprint §16.3 asks for eight fields per claim. Seven are the columns above under different
# names — text=claim, evidenceRef=evidence+artifact, reviewer=owner, publicationPermission=
# public_private, recheckTrigger=expiry_or_revalidation, plus scope and lastVerifiedAt. The
# eighth, supportedBuild, is new above. No second schema was created: a parallel registry would
# drift from this one within a week, and this file is already the thing CI can be pointed at.
# ---------------------------------------------------------------------------------------------
#
# No claim below was invented by a lane — every row quotes or paraphrases text or a constant
# already in the repository. Rows with no receipt are DRAFT (asserted, unverified by an artifact)
# or RESTRICTED (should not be said publicly without a receipt or a founder-approved qualifier).
#
# Two rows describe copy that is no longer live: the `/research` category text the 2026-09-08 IP
# gate found describing frozen technologies. They are recorded as RESTRICTED rather than deleted,
# because a registry that only lists what is live cannot stop a sentence from coming back.
#
# ---------------------------------------------------------------------------------------------
# RE-ALIGNMENT to HEAD 38d957d, 2026-09-11 (website-growth lane keyword-claims-data, WG-105)
#
# Fourteen rows were re-read against the current build and carry `lastVerifiedAt: 2026-09-11`:
# CLM-003, 004, 005, 008, 009, 011 (the capability-manifest rows), CLM-016 (promote), CLM-022,
# 023, 024 (billing and pricing constants), CLM-027, 028 (the empty benchmark registry),
# CLM-029 (one locator) and CLM-037 (/knowledge-compiler). The other thirty keep 2026-09-08 and
# `supportedBuild: 3157ee5`, which says only that nobody has re-read them.
#
# Two rows had their `limitations` extended rather than their claim changed:
#
#   CLM-016  Promotion is closed by design — now also records that promote requires plan
#            `studio` (Team, $99, `saleChannel: "contact"`) and that an Evaluation trial or a
#            self-serve Developer subscription is refused with 402. The claim was true and
#            incomplete, and the missing half is the one a growth page would trip over.
#   CLM-037  /knowledge-compiler — now records the 2026-09-11 abstention correction (see
#            CLM-047), because the page's own "where the category stops" row was one of the four
#            sentences that moved.
#
# Five rows are new, for five things the 2026-09-08 registry could not have known:
#
#   CLM-045  TXT/CSV/HTML declared and withheld behind `TEXT_INPUTS_LIVE = false`.
#   CLM-046  The live engine's relation set (supported_by, mentions, contradicts).
#   CLM-047  Ask/retrieval declines only when nothing matched — not an abstention claim.
#   CLM-048  Two identical uploads are two documents. Nothing dedupes.
#   CLM-049  WG-012: the native-structure/table/formula sentences are computed from the manifest.
#
# WG-012 cross-check (source manifest vs the Native / table / formula descriptions), done at
# 38d957d and recorded as CLM-049 rather than as a separate document:
#
#   agrees, structurally — /product/document-understanding selects its table sentence and its
#     structure sentence by reading `knownLimitations` for `no_table_or_formula_extraction` and
#     `no_native_structure_reader_yet`; /sources prints the preserved list and names cells and
#     formulas as absent from it. A page cannot drift from the manifest it reads.
#   agrees — LIVE_PRESERVED is [page, paragraph_text, bbox1000] on all eleven live rows, every
#     row carries qualifiedAt: null and qualificationReceipt: null, and ZIP is UNSUPPORTED.
#   gap — the three withheld text rows carry `converted_from_text_before_reading`,
#     `cells_are_read_back_as_rendered_text`, `comma_delimiter_and_utf8_encoding_assumed` and
#     `laid_out_by_libreoffice_not_by_a_browser`, none of which any public sentence covers. That
#     is correct while the gate is closed and becomes a copy defect the day it opens.
#   gap — `product-claims-sync.test.ts` guards a hand-listed set of surfaces, so a new page that
#     writes a reading limit in its own words is unguarded until its row is added there.
#
# Not re-aligned, and deliberately: no price, no plan name, no threshold and no measured figure
# in any row was changed. A claim whose number moved would need its own receipt, and this lane
# ran nothing.
# ---------------------------------------------------------------------------------------------
#
