name: Dynamic route and film audit
on:
  push:
    branches: [agent/evidence-first-20260912]
    paths: [.github/workflows/visual-dynamic-audit.yml, nextjs/scripts/visual-dynamic-audit.mjs]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-dynamic-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture-dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nextjs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: nextjs
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: nextjs
      - run: node scripts/visual-dynamic-audit.mjs
        working-directory: nextjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-dynamic-audit-${{ github.sha }}
          path: visual-dynamic-audit
          retention-days: 7
          if-no-files-found: error
