name: Release manifest attestation

on:
  workflow_dispatch:
    inputs:
      product_core_digest:
        description: Immutable Product Core OCI digest (sha256:...)
        required: true
        type: string
      cdr_digest:
        description: Immutable CDR OCI digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-release refs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "Release manifests may only be attested from refs/heads/${DEFAULT_BRANCH}" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: nextjs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir nextjs install --frozen-lockfile
      - name: Generate binding-complete manifest
        env:
          TAVONEL_PRODUCT_CORE_IMAGE_DIGEST: ${{ inputs.product_core_digest }}
          TAVONEL_CDR_IMAGE_DIGEST: ${{ inputs.cdr_digest }}
          TAVONEL_RELEASE_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: pnpm --dir nextjs release:manifest -- --output="${RUNNER_TEMP}/tavonel-release-manifest.json"
      - name: Attest manifest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/tavonel-release-manifest.json
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: tavonel-release-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/tavonel-release-manifest.json
          if-no-files-found: error
          retention-days: 30
