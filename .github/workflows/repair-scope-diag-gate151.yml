          git -c core.commitGraph=false merge-base --is-ancestor $B $H; NG=$?
          git --no-replace-objects merge-base --is-ancestor $B $H; NR=$?
          git merge-base --is-ancestor $B dc968a59c0f823239743d703c8bdd73908803ad9; P141=$?
          echo "DIAG[$DIAG_LABEL] is_ancestor=$A nograph=$NG noreplace=$NR B_in_dc968=$P141 shallow=$(git rev-parse --is-shallow-repository) top=$TOP gitdir=$GD $(git --version) which=$(which -a git | tr '\n' ' ')"
          echo "DIAG[$DIAG_LABEL] parents4c80=$(git rev-list --parents -n1 4c80bb3028fb73dc88e929c25baf0bec97bee4e7) parentsH=$(git rev-list --parents -n1 $H) count=$(git rev-list --count $B..$H) ancestry=$(git rev-list --ancestry-path --count $B..$H)"
