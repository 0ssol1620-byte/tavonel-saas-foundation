name: Repair scope DIAG gate151

on:
  push:
    branches: [codex/gate151-diag-20261017]

permissions:
  contents: read
  actions: read

concurrency:
  group: repair-scope-diag-gate151
  cancel-in-progress: true

jobs:
  repair-scope:
    name: Repair scope validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nextjs
