          cache: pnpm
          cache-dependency-path: nextjs/pnpm-lock.yaml
      - name: "DIAG probe after setup (before plan)"
        if: always()
        env:
          DIAG_LABEL: "setup (before plan)"
        run: |
          set +e
          B=5dd95ed815719656fe09f1af10213a9ecf1119a8; H=28d3a49875b7784584bec9191b1d02b125548c4f
          GD=$(git rev-parse --absolute-git-dir 2>&1); TOP=$(git rev-parse --show-toplevel 2>&1)
