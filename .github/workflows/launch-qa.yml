name: Launch QA

on:
  # Every PR event main runs on (opened, synchronize, reopened): the full suite runs on each push
  # to a PR, not only when it leaves draft.
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - codex/gate-acl-integration-20260927
      - codex/gate-lifecycle-integration-20260927
      - codex/operations-integration-20260830
      - codex/site-truth-integration-20260924
      - codex/tavonel-foundation-p0p2-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Frozen install, secret scan and pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nextjs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Scan repository secrets
        run: pnpm scan:secrets
      - name: Run the TypeScript and lint checks
        run: pnpm check

  browser-qa:
    needs: preflight
    name: Browser QA (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Allow cold production compilation. The webServer uses next build directly; the required
      # nextjs CI job separately runs check, tests, and the full prebuild-gated build.
      PLAYWRIGHT_WEB_SERVER_TIMEOUT: "480000"
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nextjs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Cached as in product-qa (its comment has the apt measurements), one key per browser. On PR #249 this install took
      # up to 13m29s (webkit) and 7m07s (firefox) against a 44s / 24s median, and on 2026-11-18 (run 44245837641) webkit's
      # apt download (185 packages, 139 MB) had fetched about 127 MB in 19m31s, about 110 kB/s, when the 20-minute job
      # timeout cancelled it and the job had to be re-run. The second restore key falls back to product-qa's cache, which
      # v34-matrix saves with WebKit's archives.
      - name: Read the Playwright version and runner image
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers and their apt archives
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives/*.deb
          key: browser-qa-pw-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.image }}
          restore-keys: |
            browser-qa-pw-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}-
            product-qa-pw-${{ steps.playwright.outputs.version }}-
      - name: Keep apt's downloaded archives in the cached directory
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-product-qa-archives
      - name: Install ${{ matrix.browser }} runtime
        run: |
          pnpm exec playwright install --with-deps ${{ matrix.browser }}
          # Drop archives the mirror no longer serves, so a restored cache does not grow every image.
          sudo apt-get autoclean -qq
      - name: Run launch QA
        run: pnpm exec playwright test --project=launch-${{ matrix.browser }}
      - name: Verify analytics consent at all seven widths and reduced motion, and every purchase door without launch approval
        if: matrix.browser == 'chromium'
        # This job's server has no launch flags (pilot posture), so it is where self-serve-journey's
        # "launch approval withheld" test runs: product-qa and the repair-scope browser run set
        # COMMERCIAL_MODE=live and TAVONEL_BILLING_LAUNCH_APPROVED=true and skip it (review PR201-R1 B2).
        # The spec runs in the `audit` project only; the consent spec in its width projects, as before.
        run: pnpm exec playwright test e2e/marketing-consent.spec.ts e2e/self-serve-journey.spec.ts
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-qa-${{ matrix.browser }}
          path: |
            nextjs/playwright-report
            nextjs/test-results
          if-no-files-found: ignore
          retention-days: 14

  product-qa:
    needs: preflight
    name: Product QA (widths + reduced motion + audit)
    runs-on: ubuntu-latest
    # 45, not 30. The three audit projects added below are 90 tests that walk every public route
    # at seven widths and measure contrast, 200% zoom, dialog focus, failure states, cross-tenant
    # refusals and compile resume. Measured at 2m15s with three workers against a warm production
    # build; the extra headroom is for a two-worker runner and a cold build, not for a job that is
    # allowed to get slower.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nextjs
    env:
      # Allow cold production compilation. Running pnpm build here previously repeated the
      # entire check and test suite, exhausting this allowance before Next could start.
      PLAYWRIGHT_WEB_SERVER_TIMEOUT: "480000"
      # Live-commerce posture, for this job only.
      #
      # The width projects exist to catch layout defects in the header a customer actually sees,
      # and until now they could not: the test server runs in pilot posture, where the access
      # action reads "Request access" and links to /contact (111px at 360), while tavonel.com is
      # live and reads "Start with your files" linking to /login (158px). That difference is why
      # the 360px header overflow reached main with every check green.
      #
      # `readCommercialState` (lib/commercial-state.ts:44-64) needs all four gates to agree:
      # COMMERCIAL_MODE=live, TAVONEL_BILLING_LAUNCH_APPROVED=true, PADDLE_SANDBOX unset (so the
      # provider reads "production") and VERCEL_ENV unset (so the deployment gate opens). The last
      # two are already absent on a runner and are deliberately not set here. browser-qa and
      # lighthouse keep the default pilot posture.
      COMMERCIAL_MODE: live
      TAVONEL_BILLING_LAUNCH_APPROVED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nextjs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # WebKit as well as Chromium: e2e/site-nav.spec.ts asks WebKit the same navigation
      # questions from inside the 1440 project (see that file's header for why it launches its own
      # browser). Until 2026-09-17 that test was gated on a project no job runs and never launched;
      # once it did, this job failed at `browserType.launch: Executable doesn't exist`.
      #
      # Cached, because the install is apt-bound. On 2026-11-10 (PR #234, run 42804611180) WebKit's
      # system packages -- 185 debs, 139 MB, mostly GStreamer -- took 38m01s (60.8 kB/s) on attempt 2
      # and 19m23s (119 kB/s) on attempt 3 of a 45-minute job, against about 15 s for every browser
      # download together. So both the browser binaries and the .deb archives are cached. The key carries the installed @playwright/test
      # (it pins the browser builds and the package list) and the runner image (it pins the distro
      # and the deb versions). On a hit the install below downloads no browser and apt finds every
      # archive locally, so it only unpacks; a new image restores the previous archives and apt
      # fetches just the debs that changed. Debs are cached by glob: apt's root-owned lock and
      # partial/ are unreadable to the save step.
      #
      # `--only-shell`: every project in this job is headless Chromium, which Playwright runs on
      # chromium-headless-shell, so the full Chrome for Testing build was downloaded and never run.
      - name: Read the Playwright version and runner image
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers and their apt archives
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives/*.deb
          key: product-qa-pw-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.image }}
          restore-keys: product-qa-pw-${{ steps.playwright.outputs.version }}-
      - name: Keep apt's downloaded archives in the cached directory
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-product-qa-archives
      - name: Install Chromium and WebKit runtimes
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium webkit
          # Drop archives the mirror no longer serves, so a restored cache does not grow every image.
          sudo apt-get autoclean -qq
      # One command, seven projects, one build.
      #
      # The webServer in playwright.config.ts runs `pnpm exec next build && pnpm start` with
      # `reuseExistingServer: false`, so every separate `playwright test` invocation pays for
      # another production build. The projects therefore share one invocation.
      #
      # The last three are the 2026-09-11 competitive-audit checks (V01-V05, V08, S07, U06).
      # Three projects rather than four more width projects: `audit` runs the whole set once at
      # 1440 because each spec drives the widths, contexts and media it needs from the inside
      # (overflow-audit walks all seven widths, film-fallback-audit opens 899 and 901,
      # contrast-zoom-audit builds a 640px/2x context for 200% zoom), while `audit-768` and
      # `audit-1280` add the tablet edge and the small laptop -- the two viewports this job has
      # never covered -- for the specs where the viewport is the variable.
      - name: Run the product width, reduced-motion and competitive-audit projects
        run: >-
          pnpm exec playwright test
          --project=1440 --project=390 --project=360 --project=reduced-motion
          --project=audit --project=audit-768 --project=audit-1280
      # Phase 4 follow-ups (f), the RSC-leak probe. PR #157 found a scoring machine's absolute path, OS user name
      # included, in the /benchmarks HTML and again in its RSC payload, where no browser check can see it. The probe reads
      # every prerendered HTML document and RSC payload that the step above built under .next (the fixture env of
      # playwright.config.ts) and fails on a drive-letter path, /Users/, /home/ or this runner's OS user name, read from
      # the environment. It runs even when a browser check failed, so a leak is never hidden behind another red step.
      - name: Probe the built HTML and RSC payloads for machine paths
        if: ${{ !cancelled() }}
        run: node scripts/launch-qa/rsc-leak-probe.mjs --reuse-build
      - name: Preserve product failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-qa
          path: |
            nextjs/playwright-report
            nextjs/test-results
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    needs: preflight
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    # Three production-build measurements per route plus the build exceed 20 minutes
    # after the Korean pricing/contact routes joined the enforced route set.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nextjs/pnpm-lock.yaml
      # The clean-install harness syntax-checks the published source agent and runs the Python
      # verifier, and this job had no Python. Without it the harness FAILS (it required Python
      # for the source agent before the verifiers existed) rather than reporting a skip.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      # Cached as in product-qa (its comment has the apt measurements). Full Chromium, not --only-shell: the Lighthouse step
      # below launches chromium.executablePath(). Its own key, falling back to product-qa's, whose archives hold Chromium's
      # system packages: this job has failed on its budgets, and actions/cache saves only after a green job.
      - name: Read the Playwright version and runner image
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers and their apt archives
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives/*.deb
          key: lighthouse-pw-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.image }}
          restore-keys: |
            lighthouse-pw-${{ steps.playwright.outputs.version }}-
            product-qa-pw-${{ steps.playwright.outputs.version }}-
      - name: Keep apt's downloaded archives in the cached directory
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-product-qa-archives
      - name: Install Chromium runtime
        run: |
          pnpm exec playwright install --with-deps chromium
          # Drop archives the mirror no longer serves, so a restored cache does not grow every image.
          sudo apt-get autoclean -qq
      - run: pnpm exec next build
      - name: Start production app
        run: pnpm start --hostname 127.0.0.1 --port 3117 > /tmp/tavonel-next.log 2>&1 &
      - name: Wait for health
        run: node scripts/launch-qa/wait-for-health.mjs
      # X08: catch recipe and distribution drift against the current release.
      #
      # In THIS job and not in product-qa, which is where they were proposed: product-qa's server
      # is playwright.config.ts's webServer, so it exists only for the duration of the
      # `playwright test` invocation and a step after it would find nothing listening. This job
      # starts its own server and keeps it up for the steps that follow, which is what
      # smoke.mjs needs -- it makes three unauthenticated GETs.
      #
      # Port 3117, not 3000: that is the port this job starts, and the proposed 127.0.0.1:3000
      # would have pointed the smoke at nothing.
      - name: Developer distribution — clean install, public downloads only
        run: node scripts/verify-developer-clean-install.mjs
      - name: Integration recipes — smoke
        env:
          TAVONEL_RECIPE_BASE_URL: http://127.0.0.1:3117
        run: node scripts/developer-recipes/smoke.mjs
      - name: Enforce Lighthouse budgets
        run: CHROME_PATH=$(node -e "const { chromium } = require('@playwright/test'); process.stdout.write(chromium.executablePath())") pnpm qa:lighthouse
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/tavonel-next.log

  # The V34 route x width matrix (D33 section 5) and its harness self-test, with the drawer pass
  # (WO-CI-9). Nothing else in this workflow runs the v34-* Playwright projects.
  #
  # Its own job, not steps appended to product-qa. That job's build is made by the Playwright webServer
  # inside its one invocation and its server stops with it, so reusing the build means starting two more
  # servers after a 45-minute job and adding this job's whole run to that job's wall clock; on its own
  # runner it costs one build and runs beside product-qa instead. One build here serves both servers:
  # V34_SHOW_HELD is read per request (lib/v34/release.ts), so the flag only goes on the QA server.
  #
  # Widths: layout at 390, 412 and 1440; contrast and keyboard at 412 and 1440; motion and 200% zoom at
  # 1440; the drawer at 390 and 412 (it serves 1000px and below). Only the live registry rows run here.
  # The held-route check runs against the second server, started without V34_SHOW_HELD.
  #
  # Timeout, from one measured local run on 2026-11-17 (Windows, 12 cores, two Playwright workers as on a
  # 4-vCPU runner): build 7m21s, the self-test and matrix invocation 13m07s (391 tests), the held check 2s.
  # About 21 minutes of work plus install; 50 is that doubled for a slower runner and a cold build, rounded
  # up. It is not a budget to grow into: a run past it is a regression to find, not a number to raise.
  v34-matrix:
    needs: preflight
    name: V34 matrix (chromium, drawer pass)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: nextjs
    env:
      # The playwright.config.ts webServer environment, for the build and both servers.
      NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: foundation-browser-e2e-anon-key
      PLAYWRIGHT_LOCAL_HTTP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nextjs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Every v34-* project run here is headless Chromium, which Playwright runs on chromium-headless-shell, and one
      # self-test case also launches WebKit itself (e2e/v34-support.selftest.spec.ts, "a control in a closed details
      # body is not owed a tab stop": WebKit's Tab order skips summary, which is where the keyboard-trap false positive
      # showed). With Chromium alone that case failed here at `browserType.launch: Executable doesn't exist` (WO-CI-17).
      #
      # The same three steps as product-qa, with the same cache key and the same browser set, so either job's save is a
      # hit for the other and WebKit's apt archives are not downloaded twice (product-qa's comment has the measurements).
      - name: Read the Playwright version and runner image
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers and their apt archives
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives/*.deb
          key: product-qa-pw-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.image }}
          restore-keys: product-qa-pw-${{ steps.playwright.outputs.version }}-
      - name: Keep apt's downloaded archives in the cached directory
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/apt-archives" | sudo tee /etc/apt/apt.conf.d/99-product-qa-archives
      - name: Install Chromium and WebKit runtimes
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium webkit
          # Drop archives the mirror no longer serves, so a restored cache does not grow every image.
          sudo apt-get autoclean -qq
      - name: Build once for both servers
        run: V34_SHOW_HELD=1 pnpm exec next build
      - name: Start the QA server (held routes shown) and the production-mode server (no flag)
        run: |
          V34_SHOW_HELD=1 pnpm start --hostname 127.0.0.1 --port 3117 > /tmp/v34-qa-server.log 2>&1 &
          pnpm start --hostname 127.0.0.1 --port 3118 > /tmp/v34-production-server.log 2>&1 &
          QA_HEALTH_URL=http://127.0.0.1:3117/api/healthz node scripts/launch-qa/wait-for-health.mjs
          QA_HEALTH_URL=http://127.0.0.1:3118/api/healthz node scripts/launch-qa/wait-for-health.mjs
      - name: Run the V34 harness self-test and the matrix over the live registry rows
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3117
          V34_RELEASE: live
          V34_WIDTHS: 390,412,1440
          V34_QA_OUT: v34-qa-out/qa
        run: pnpm exec playwright test --project=v34-selftest --project=v34-chromium --retries=0
      # Runs even when the matrix failed, so a held route that renders in production is never hidden behind it.
      # Its own output and report folders: a second invocation empties the first one's test-results.
      - name: Held routes answer 404 on the server without V34_SHOW_HELD
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3118
          PLAYWRIGHT_HTML_REPORT: playwright-report-held
          V34_SERVER_MODE: production
          V34_QA_OUT: v34-qa-out/production
        run: pnpm exec playwright test --project=v34-chromium --grep "@pass:held" --output=test-results-held --retries=0
      - name: Show the server logs on failure
        if: failure()
        run: tail -n 200 /tmp/v34-qa-server.log /tmp/v34-production-server.log
      - name: Preserve the V34 receipt and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v34-matrix
          path: |
            nextjs/v34-qa-out
            nextjs/playwright-report
            nextjs/test-results
            nextjs/playwright-report-held
            nextjs/test-results-held
          if-no-files-found: ignore
          retention-days: 14

  launch-gate:
    name: Launch gate
    if: always()
    needs: [preflight, browser-qa, product-qa, lighthouse, v34-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Require every launch check
        run: |
          test "${{ needs.preflight.result }}" = "success"
          test "${{ needs.browser-qa.result }}" = "success"
          test "${{ needs.product-qa.result }}" = "success"
          test "${{ needs.lighthouse.result }}" = "success"
          test "${{ needs.v34-matrix.result }}" = "success"
