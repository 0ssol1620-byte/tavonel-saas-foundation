name: CI
on:
  pull_request:
  push:
    branches: [main, "agent/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: CDR Worker tests and types
        working-directory: quarantine-sidecar/foundation-cdr-worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node node_modules/typescript/bin/tsc --noEmit
      - run: pnpm build
  nextjs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      # Blueprint §43, P-13: the secret scan runs before anything is built, and it scans the whole
      # checkout rather than nextjs/ alone -- a key pasted into a workflow file or a migration is
      # the same incident as one pasted into a route. It needs no dependencies of its own, so it
      # is the cheapest step that can stop a merge, and `nextjs` is a required check on main.
      - run: pnpm scan:secrets
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
