name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * 1"
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  # A newer push to the same pull request supersedes its older run. Every other event (a push to main or an
  # integration branch, a manual or scheduled run) gets a group of its own run id, so no main, release-gate or
  # dispatched evidence run is ever cancelled or replaced while pending (WO-CI-PARALLEL-1).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never
          upload-database: false
      - name: Preserve CodeQL SARIF
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results/*.sarif
          if-no-files-found: error
          retention-days: 30
