name: foundation-ocr-gpu-image

on:
  pull_request:
    paths:
      - "workers/foundation-ocr-gpu/**"
      - ".github/workflows/foundation-ocr-gpu-image.yml"
  push:
    branches: [main]
    paths:
      - "workers/foundation-ocr-gpu/**"
      - ".github/workflows/foundation-ocr-gpu-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/0ssol1620-byte/tavonel-foundation-ocr-gpu

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Worker tests
        working-directory: workers/foundation-ocr-gpu
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt 'pytest>=8,<10'
          python -m pytest tests -q

      - name: Free space for CUDA image layers
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate; publish only from main
        id: image
        uses: docker/build-push-action@v6
        with:
          context: workers/foundation-ocr-gpu
          file: workers/foundation-ocr-gpu/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false

      - name: Record immutable image identity
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p "$RUNNER_TEMP/ocr-gpu-evidence"
          {
            echo '# Foundation OCR GPU candidate'
            echo
            echo "- image: \`$IMAGE\`"
            echo "- digest: \`$DIGEST\`"
            echo "- source commit: \`$GITHUB_SHA\`"
            echo "- built at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo 'Build and mocked tests do not prove CUDA selection. Use a separate GPU canary and a signed synthetic scanned PDF before changing a production endpoint.'
          } | tee "$RUNNER_TEMP/ocr-gpu-evidence/IMAGE_CANDIDATE.md"
          cat "$RUNNER_TEMP/ocr-gpu-evidence/IMAGE_CANDIDATE.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate identity
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: foundation-ocr-gpu-image-${{ github.sha }}
          path: ${{ runner.temp }}/ocr-gpu-evidence/IMAGE_CANDIDATE.md
          retention-days: 30
