name: foundation-ocr-gpu-image

on:
  pull_request:
    paths:
      - "workers/foundation-ocr-gpu/**"
      - ".github/workflows/foundation-ocr-gpu-image.yml"
  push:
    branches: [main]
    paths:
      - "workers/foundation-ocr-gpu/**"
      - ".github/workflows/foundation-ocr-gpu-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ocr-gpu-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/0ssol1620-byte/tavonel-foundation-ocr-gpu

jobs:
  candidate:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free space for CUDA image layers
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Worker tests
        working-directory: workers/foundation-ocr-gpu
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt 'pytest>=8,<10'
          python -m pytest tests -q
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build candidate without publishing
        uses: docker/build-push-action@v6
        with:
          context: workers/foundation-ocr-gpu
          file: workers/foundation-ocr-gpu/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: foundation-ocr-gpu:candidate
          provenance: false
      - name: Check image provider and runtime user
        run: |
          docker run --rm --entrypoint python3 foundation-ocr-gpu:candidate -c "import onnxruntime as ort; assert 'CUDAExecutionProvider' in ort.get_available_providers(), ort.get_available_providers()"
          docker run --rm --entrypoint sh foundation-ocr-gpu:candidate -c 'test "$(id -u)" = 10001 && ! dpkg -l | grep -qi openssh'

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free space for CUDA image layers
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Worker tests
        working-directory: workers/foundation-ocr-gpu
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt 'pytest>=8,<10'
          python -m pytest tests -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate
        id: image
        uses: docker/build-push-action@v6
        with:
          context: workers/foundation-ocr-gpu
          file: workers/foundation-ocr-gpu/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: false

      - name: Check image provider and runtime user
        run: |
          docker run --rm --entrypoint python3 "$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -c "import onnxruntime as ort; assert 'CUDAExecutionProvider' in ort.get_available_providers(), ort.get_available_providers()"
          docker run --rm --entrypoint sh "$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -c 'test "$(id -u)" = 10001 && ! dpkg -l | grep -qi openssh'

      - name: Publish qualified candidate and capture registry digest
        id: push
        run: |
          tag="$IMAGE:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker push "$tag"
          digest_ref=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          case "$digest_ref" in
            "$IMAGE@sha256:"*) ;;
            *) echo "Registry digest was not returned" >&2; exit 1 ;;
          esac
          echo "digest=${digest_ref#*@}" >> "$GITHUB_OUTPUT"

      - name: Record immutable image identity
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p "$RUNNER_TEMP/ocr-gpu-evidence"
          {
            echo '# Foundation OCR GPU candidate'
            echo
            echo "- image: \`$IMAGE\`"
            echo "- digest: \`$DIGEST\`"
            echo "- source commit: \`$GITHUB_SHA\`"
            echo "- built at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo 'Build and mocked tests do not prove CUDA selection. Use a separate GPU canary and a signed synthetic scanned PDF before changing a production endpoint.'
          } | tee "$RUNNER_TEMP/ocr-gpu-evidence/IMAGE_CANDIDATE.md"
          cat "$RUNNER_TEMP/ocr-gpu-evidence/IMAGE_CANDIDATE.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate identity
        uses: actions/upload-artifact@v7
        with:
          name: foundation-ocr-gpu-image-${{ github.sha }}
          path: ${{ runner.temp }}/ocr-gpu-evidence/IMAGE_CANDIDATE.md
          retention-days: 30
