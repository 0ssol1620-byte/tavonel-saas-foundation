# Does 0001 to the head migration still apply to an empty database, and does the RLS matrix hold?
#
# Neither question had ever been answered. Production's migration history records 0001,
# 0020-0023 and 0038-0048 only, while tables from 0002-0037 exist (gap matrix L-2), so the
# schema cannot be derived from the history, and `supabase/tests/*.sql` had never executed
# anywhere because the build machine has no Docker (customer-data gate, precondition 1).
#
# A GitHub runner has Docker. That is the whole trick: `supabase db start` applies every file
# under supabase/migrations in filename order to a throwaway Postgres 17, so a job log here is
# the rehearsal receipt, and a failure in that step IS the finding rather than a broken build.
#
# No secret, no project ref, no access token, no db URL of the live project. This job must never
# be able to reach it -- it proves what the files say, not what production happens to contain.
name: DB rehearsal

on:
  pull_request:
  push:
    branches: [main, "agent/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: db-rehearsal-${{ github.ref }}
  cancel-in-progress: true

env:
  # The last version production's own migration history records (gap matrix L-2). Fingerprinting
  # the chain truncated here is the half of the G-9 condition-2 comparison that can be produced
  # from the files; production supplies the other half, read-only, later. It is a boundary fact
  # about production, not a count of this folder -- which is why it is pinned and the head is not.
  HISTORY_BOUNDARY: "0048"

jobs:
  collector-only-eligibility:
    name: Verify exact collector-only DB evidence reuse
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independently verify unchanged DB source and prior evidence
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node nextjs/scripts/repair-collector-only.mjs eligibility
  db-rehearsal:
    name: db-rehearsal
    needs: [collector-only-eligibility]
    # Missing verifier, denied API access, altered paths or any classifier failure runs DB normally.
    if: always() && (needs.collector-only-eligibility.result != 'success' || needs.collector-only-eligibility.outputs.eligible != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Manual run 36803612422 failed on a fresh runner: right after the image pull, Docker could
      # not bind 0.0.0.0:54322 ("address already in use"), before any SQL ran. The socket's owner
      # was not recorded, so the cause is unproven. Hypothesis: 54320-54329 lie inside Linux's
      # default ephemeral range (32768-60999), so an earlier outbound connection on this runner
      # (checkout, the parallel layer pull) may be handed one as its source port. Mitigation:
      # exclude them from automatic source-port allocation, on GitHub-hosted disposable runners
      # only, appending to (never replacing) any existing reservation. Explicit binds (the local
      # stack) still work. The CLI default ports stay, because real-auth-ci-contract.mjs accepts
      # only them. Nothing is stopped or killed; `ss` records any holder before the bind.
      - name: Keep the local stack ports out of this runner's ephemeral range
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          key=/proc/sys/net/ipv4/ip_local_reserved_ports
          before="$(cat "$key")"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${before:+$before,}54320-54329"
          after="$(cat "$key")"
          echo "reserved before='$before' after='$after'"
          covered() { echo "$after" | tr ',' '\n' | awk -F- -v p="$1" 'NF { hi = ($2 == "" ? $1 : $2); if (p >= $1 && p <= hi) f = 1 } END { exit !f }'; }
          for port in $(seq 54320 54329) $(echo "$before" | tr ',-' '  '); do covered "$port"; done
          ss -Htanp '( sport >= :54320 and sport <= :54329 )' || true

      - uses: actions/checkout@v4

      # Pinned to the version the repository already runs locally. `latest` would let a CLI
      # release change what this receipt means without a commit saying so.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # setup-cli selects GHCR by default. GHCR throttled this public image on four fresh
      # runners, including one authenticated pull, before any SQL ran. The same pinned
      # supabase/postgres:17.6.1.165 tag is published on Docker Hub (digest verified at the
      # registry). Override the setup action for all subsequent local-CLI steps.
      - name: Use the official Docker Hub image registry for the local stack
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"


      # The repository carries migrations and tests but no config.toml, because the CLI's
      # config is local-stack tooling rather than schema. `init` writes it and needs no Docker.
      # The grep is the assertion: Postgres 17 is what production runs, so a rehearsal on any
      # other major version proves nothing about it.
      - name: Create the local stack config
        run: |
          test -f supabase/config.toml || supabase init
          grep -qx 'major_version = 17' supabase/config.toml
      # The ACL pgTAP file is intentionally checked in beside its SQL draft, not as a production
      # migration. `supabase test db` discovers every file under supabase/tests, while db reset
      # only applies supabase/migrations; without this runner-local bridge that test would run
      # against a schema with no ACL functions/table. Create a timestamp using the pinned official
      # CLI, then copy the exact reviewed draft into that generated file. The checkout and local
      # Postgres stack are disposable; this file is never committed, pushed, or applied remotely.
      - name: Stage the reviewed ACL draft as a runner-local migration
        id: acl-draft
        run: |
          set -euo pipefail
          draft=supabase/drafts/google-viewer-principal-boundary.sql
          test_file=supabase/tests/google_viewer_principal_boundary.sql
          if [[ ! -e "$draft" && ! -e "$test_file" ]]; then
            echo "Neither ACL draft nor its pgTAP test is present; no temporary migration needed."
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$draft"
          test -f "$test_file"

          shopt -s nullglob
          existing=(supabase/migrations/*_google_viewer_principal_boundary.sql)
          if ((${#existing[@]} > 0)); then
            test "${#existing[@]}" -eq 1
            acl_path="${existing[0]}"
            [[ "$(basename "$acl_path")" =~ ^([0-9]{14})_google_viewer_principal_boundary\.sql$ ]]
            echo "A repository migration already registers this ACL test schema; normal db reset applies it."
            echo "state=registered" >> "$GITHUB_OUTPUT"
            echo "path=$acl_path" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          supabase migration new --help
          supabase migration new google_viewer_principal_boundary
          generated=(supabase/migrations/*_google_viewer_principal_boundary.sql)
          test "${#generated[@]}" -eq 1
          [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_google_viewer_principal_boundary\.sql$ ]]
          acl_version="${BASH_REMATCH[1]}"
          cp -- "$draft" "${generated[0]}"
          cmp -- "$draft" "${generated[0]}"
          sha256sum "$draft" "${generated[0]}"
          echo "state=ephemeral" >> "$GITHUB_OUTPUT"
          echo "path=${generated[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$acl_version" >> "$GITHUB_OUTPUT"

      # The refresh queue is an unregistered draft that depends on the verified ACL boundary
      # schema. It is copied only into the throwaway database chain after that boundary.
      - name: Stage the reviewed Google Drive ACL refresh after ACL boundary
        id: acl-refresh-draft
        run: |
          set -euo pipefail
          boundary_draft=supabase/drafts/google-viewer-principal-boundary.sql
          draft=supabase/drafts/google-drive-acl-refresh/queue.sql
          test_source=supabase/drafts/google-drive-acl-refresh/tests/google_drive_acl_refresh_queue.sql
          test_target=supabase/tests/google_drive_acl_refresh_queue.sql
          if [[ ! -e "$draft" && ! -e "$test_source" ]]; then
            echo "Neither Google Drive ACL refresh draft nor its pgTAP test is present; no temporary migration needed."
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$boundary_draft"
          test -f "$draft"
          test -f "$test_source"
          boundary_state='${{ steps.acl-draft.outputs.state }}'
          boundary_version='${{ steps.acl-draft.outputs.version }}'
          if [[ "$boundary_state" == absent || ! "$boundary_version" =~ ^[0-9]{14}$ ]]; then
            echo "ACL refresh draft requires the ACL boundary draft to be staged first." >&2
            exit 1
          fi

          expected_boundary_sha256=8aad3ffaf8d3062c764988029a1235db4e04ab181e0211524677f9f213e306bc
          expected_queue_sha256=04b75937e204db4da659352c6f9194c110018cd45715c72553ee0e2e41e8c4a8
          expected_test_sha256=ecc2b851051b7bbccaed09b231e44a9dcc4fabf6483f6b572fafe3488c1177e2
          test "$(sha256sum "$boundary_draft" | cut -d ' ' -f 1)" = "$expected_boundary_sha256"
          test "$(sha256sum "$draft" | cut -d ' ' -f 1)" = "$expected_queue_sha256"
          test "$(sha256sum "$test_source" | cut -d ' ' -f 1)" = "$expected_test_sha256"
          printf '%s  %s\n' "$expected_boundary_sha256" "$boundary_draft" | sha256sum --check
          printf '%s  %s\n' "$expected_queue_sha256" "$draft" | sha256sum --check
          printf '%s  %s\n' "$expected_test_sha256" "$test_source" | sha256sum --check

          shopt -s nullglob
          existing=(supabase/migrations/*_google_drive_acl_refresh_queue.sql)
          if (("${#existing[@]}" > 0)); then
            echo "The Google Drive ACL refresh SQL must remain an unregistered draft during this phase." >&2
            exit 1
          fi
          test ! -e "$test_target"

          # Create a runner-local successor to the ACL boundary migration.
          now_version="$(date -u +%Y%m%d%H%M%S)"
          if [[ "$boundary_version" > "$now_version" ]]; then
            echo "ACL boundary migration version is in the future; cannot generate a later ACL refresh migration now." >&2
            exit 1
          fi
          while [[ ! "$now_version" > "$boundary_version" ]]; do
            sleep 1
            now_version="$(date -u +%Y%m%d%H%M%S)"
          done
          supabase migration new google_drive_acl_refresh_queue
          generated=(supabase/migrations/*_google_drive_acl_refresh_queue.sql)
          test "${#generated[@]}" -eq 1
          [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_google_drive_acl_refresh_queue\.sql$ ]]
          refresh_version="${BASH_REMATCH[1]}"
          [[ "$refresh_version" > "$boundary_version" ]]
          cp -- "$draft" "${generated[0]}"
          cmp -- "$draft" "${generated[0]}"
          printf '%s  %s\n' "$expected_queue_sha256" "$draft" "$expected_queue_sha256" "${generated[0]}" | sha256sum --check
          cp -- "$test_source" "$test_target"
          cmp -- "$test_source" "$test_target"
          printf '%s  %s\n' "$expected_test_sha256" "$test_source" "$expected_test_sha256" "$test_target" | sha256sum --check
          echo "state=ephemeral" >> "$GITHUB_OUTPUT"
          echo "path=${generated[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$refresh_version" >> "$GITHUB_OUTPUT"

      # Keep the async authority SQL a draft in the repository. This ordered runner-local copy
      # exercises it only after the ACL35 schema/helper draft; the version assertion makes that
      # dependency visible in the exact disposable migration chain. No production migration is
      # registered, and both source and generated file hashes are printed for the rehearsal log.
      - name: Stage the reviewed async authority draft after ACL
        id: async-authority-draft
        run: |
          set -euo pipefail
          draft=supabase/drafts/compile-job-viewer-authority.sql
          test_file=supabase/tests/compile_job_viewer_authority.sql
          if [[ ! -e "$draft" && ! -e "$test_file" ]]; then
            echo "Neither async authority draft nor its pgTAP test is present; no temporary migration needed."
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$draft"
          test -f "$test_file"
          acl_state='${{ steps.acl-draft.outputs.state }}'
          acl_version='${{ steps.acl-draft.outputs.version }}'
          refresh_state='${{ steps.acl-refresh-draft.outputs.state }}'
          refresh_version='${{ steps.acl-refresh-draft.outputs.version }}'
          order_version="$acl_version"
          if [[ "$refresh_state" == ephemeral ]]; then
            if [[ ! "$refresh_version" =~ ^[0-9]{14}$ ]]; then
              echo "ACL refresh stage returned no ordered migration version." >&2
              exit 1
            fi
            order_version="$refresh_version"
          elif [[ "$refresh_state" != absent ]]; then
            echo "ACL refresh stage returned an unexpected state." >&2
            exit 1
          fi
          if [[ "$acl_state" == absent || ! "$order_version" =~ ^[0-9]{14}$ ]]; then
            echo "Async authority draft requires the ACL draft migration to be present first." >&2
            exit 1
          fi

          shopt -s nullglob
          existing=(supabase/migrations/*_compile_job_viewer_authority.sql)
          if ((${#existing[@]} > 0)); then
            echo "The async authority SQL must remain an unregistered draft during this phase." >&2
            exit 1
          fi

          # The CLI versions migrations to the current UTC second. Wait for the last staged
          # ACL dependency's successor second so equal-version artifacts cannot reverse order.
          now_version="$(date -u +%Y%m%d%H%M%S)"
          if [[ "$order_version" > "$now_version" ]]; then
            echo "ACL dependency version is in the future; cannot generate a later disposable migration now." >&2
            exit 1
          fi
          while [[ ! "$now_version" > "$order_version" ]]; do
            sleep 1
            now_version="$(date -u +%Y%m%d%H%M%S)"
          done
          supabase migration new compile_job_viewer_authority
          generated=(supabase/migrations/*_compile_job_viewer_authority.sql)
          test "${#generated[@]}" -eq 1
          [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_compile_job_viewer_authority\.sql$ ]]
          async_version="${BASH_REMATCH[1]}"
          [[ "$async_version" > "$order_version" ]]
          cp -- "$draft" "${generated[0]}"
          cmp -- "$draft" "${generated[0]}"
          sha256sum "$draft" "${generated[0]}"
          echo "state=ephemeral" >> "$GITHUB_OUTPUT"
          echo "path=${generated[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$async_version" >> "$GITHUB_OUTPUT"

      # The intake triage schema stays in drafts. Copy it only into this GitHub-hosted,
      # throwaway Postgres rehearsal, after the existing ACL and async authority drafts.
      # The named constraint and schema objects must be exercised after their prerequisites.
      - name: Stage the reviewed intake triage draft after async authority
        id: intake-triage-draft
        run: |
          set -euo pipefail
          draft=supabase/drafts/migrations/20261004120000_foundation_intake_triage_v3.sql
          test_source=supabase/drafts/tests/foundation_intake_triage_binding.sql
          test_target=supabase/tests/foundation_intake_triage_binding.sql
          if [[ ! -e "$draft" && ! -e "$test_source" ]]; then
            echo "Neither intake triage draft nor its pgTAP test is present; no temporary migration needed."
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$draft"
          test -f "$test_source"
          test ! -e "$test_target"
          async_state='${{ steps.async-authority-draft.outputs.state }}'
          async_version='${{ steps.async-authority-draft.outputs.version }}'
          if [[ "$async_state" == absent || ! "$async_version" =~ ^[0-9]{14}$ ]]; then
            echo "Intake triage rehearsal requires ACL and async authority staging first." >&2
            exit 1
          fi

          expected_migration_sha256=092247c80b04e861471cb04edf7ba22699ebc7bbf81cb067b6840724ebb7a00e
          expected_test_sha256=f142517c4432668cc291abf7ed3942976a373149c3842dfc45a1ead534cefda0
          test "$(sha256sum "$draft" | cut -d ' ' -f 1)" = "$expected_migration_sha256"
          test "$(sha256sum "$test_source" | cut -d ' ' -f 1)" = "$expected_test_sha256"
          printf '%s  %s\n' "$expected_test_sha256" "$test_source" | sha256sum --check

          shopt -s nullglob
          existing=(supabase/migrations/*_foundation_intake_triage_v3.sql)
          test "${#existing[@]}" -eq 0
          now_version="$(date -u +%Y%m%d%H%M%S)"
          if [[ "$async_version" > "$now_version" ]]; then
            echo "Async authority migration version is in the future; cannot generate a later intake migration now." >&2
            exit 1
          fi
          while [[ ! "$now_version" > "$async_version" ]]; do
            sleep 1
            now_version="$(date -u +%Y%m%d%H%M%S)"
          done
          supabase migration new foundation_intake_triage_v3
          generated=(supabase/migrations/*_foundation_intake_triage_v3.sql)
          test "${#generated[@]}" -eq 1
          [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_foundation_intake_triage_v3\.sql$ ]]
          intake_version="${BASH_REMATCH[1]}"
          [[ "$intake_version" > "$async_version" ]]
          cp -- "$draft" "${generated[0]}"
          cmp -- "$draft" "${generated[0]}"
          printf '%s  %s\n' "$expected_migration_sha256" "$draft" "$expected_migration_sha256" "${generated[0]}" | sha256sum --check
          cp -- "$test_source" "$test_target"
          cmp -- "$test_source" "$test_target"
          printf '%s  %s\n' "$expected_test_sha256" "$test_source" "$expected_test_sha256" "$test_target" | sha256sum --check
          echo "state=ephemeral" >> "$GITHUB_OUTPUT"
          echo "path=${generated[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$intake_version" >> "$GITHUB_OUTPUT"

      # Completed-read proof remains a create-once draft in this disposable checkout.
      # Stage after all current schema/draft prerequisites; never add it to production discovery or replay.
      - name: Stage the exact completed-read producer draft after intake triage
        id: completed-read-draft
        run: |
          set -euo pipefail
          draft=supabase/drafts/migrations/20261005130000_foundation_completed_read_proof.sql
          test_source=supabase/drafts/tests/foundation_completed_read_proof.sql
          test_target=supabase/tests/foundation_completed_read_proof.sql
          if [[ ! -e "$draft" && ! -e "$test_source" ]]; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$draft"
          test -f "$test_source"
          test ! -e "$test_target"
          intake_state='${{ steps.intake-triage-draft.outputs.state }}'
          intake_version='${{ steps.intake-triage-draft.outputs.version }}'
          test "$intake_state" = ephemeral
          [[ "$intake_version" =~ ^[0-9]{14}$ ]]
          expected_migration_sha256=c92a5656175ebac658af6e1246160bff462edac34dfa6534a304797f572c8163
          expected_test_sha256=3ef70e5c2d24aebaf67b06f89f86564e5b94d7154e8074dd2f8947693c129da1
          printf '%s  %s\n' "$expected_migration_sha256" "$draft" "$expected_test_sha256" "$test_source" | sha256sum --check
          shopt -s nullglob
          existing=(supabase/migrations/*_foundation_completed_read_proof.sql)
          test "${#existing[@]}" -eq 0
          now_version="$(date -u +%Y%m%d%H%M%S)"
          if [[ "$intake_version" > "$now_version" ]]; then
            echo "Intake version is in the future; refusing an unordered completed-read draft." >&2
            exit 1
          fi
          while [[ ! "$now_version" > "$intake_version" ]]; do
            sleep 1
            now_version="$(date -u +%Y%m%d%H%M%S)"
          done
          supabase migration new --help
          supabase migration new foundation_completed_read_proof
          generated=(supabase/migrations/*_foundation_completed_read_proof.sql)
          test "${#generated[@]}" -eq 1
          [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_foundation_completed_read_proof\.sql$ ]]
          completed_read_version="${BASH_REMATCH[1]}"
          [[ "$completed_read_version" > "$intake_version" ]]
          cp -- "$draft" "${generated[0]}"
          cmp -- "$draft" "${generated[0]}"
          printf '%s  %s\n' "$expected_migration_sha256" "$draft" "$expected_migration_sha256" "${generated[0]}" | sha256sum --check
          cp -- "$test_source" "$test_target"
          cmp -- "$test_source" "$test_target"
          printf '%s  %s\n' "$expected_test_sha256" "$test_source" "$expected_test_sha256" "$test_target" | sha256sum --check
          echo "state=ephemeral" >> "$GITHUB_OUTPUT"
          echo "path=${generated[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$completed_read_version" >> "$GITHUB_OUTPUT"

      # Artifact names are derived from the post-staging migration folder, so the schema
      # artifact is named by the exact temporary head that db reset will apply.
      - name: Read the head migration version out of the folder
        id: chain
        run: |
          head_version="$(ls supabase/migrations/*.sql | sed 's#.*/##' | sed -E 's/^([0-9]+)_.*/\1/' | sort | tail -1)"
          test -n "$head_version"
          echo "head=$head_version" >> "$GITHUB_OUTPUT"
          echo "head migration = $head_version, history boundary = $HISTORY_BOUNDARY"

      # Approach: move everything past the boundary aside and let `supabase db start` apply what
      # is left, then restore the files and re-apply the whole chain with `supabase db reset`.
      # Both commands exist in the pinned CLI 2.116.0 and neither needs a project ref. The
      # alternative -- copying 0001..0048 into a temporary folder -- would need the CLI to be
      # pointed at that folder, and 2.116.0 has no flag for that.
      #
      # DB_URL comes from `supabase status`, which prints the local stack's loopback connection
      # string (127.0.0.1, the container's own postgres/postgres). It is not a secret and it is
      # never echoed: the value is eval'd out of a pipeline and psql is handed the variable.
      - name: Apply the chain up to the history boundary and fingerprint it
        run: |
          mkdir -p /tmp/deferred-migrations
          for file in supabase/migrations/*.sql; do
            version="$(basename "$file" | sed -E 's/^([0-9]+)_.*/\1/')"
            if [ "$version" \> "$HISTORY_BOUNDARY" ]; then mv "$file" /tmp/deferred-migrations/; fi
          done
          # Evidence only: any socket still holding a stack port is printed before the bind.
          ss -Htanp '( sport >= :54320 and sport <= :54329 )' || true
          supabase db start
          eval "$(supabase status --output env | grep '^DB_URL=')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -F "$(printf '\t')" \
            -f nextjs/scripts/db/catalog-fingerprints.sql > /tmp/fingerprints-boundary.tsv
          jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {kind: .[0], object: .[1], fingerprint: .[2]})' \
            /tmp/fingerprints-boundary.tsv > "fingerprints-after-${HISTORY_BOUNDARY}.json"
          echo "fingerprint rows: $(jq 'length' "fingerprints-after-${HISTORY_BOUNDARY}.json")"

      - uses: actions/upload-artifact@v4
        with:
          name: fingerprints-after-${{ env.HISTORY_BOUNDARY }}
          path: fingerprints-after-${{ env.HISTORY_BOUNDARY }}.json
          retention-days: 30
          if-no-files-found: error

      - name: Restore the rest of the chain and apply every migration from empty
        run: |
          mv /tmp/deferred-migrations/*.sql supabase/migrations/
          rmdir /tmp/deferred-migrations
          supabase db reset

      - name: Print the resulting migration history
        run: supabase migration list --local

      - name: Exercise concurrent operation and contact admission on the disposable database
        env:
          LOCAL_OPERATION_GUARD_TEST: "1"
          PGPORT: "54322"
          PGPASSWORD: postgres
        run: node nextjs/scripts/db/operation-guard-race.mjs

      - name: Install and prove scheduled expiry cleanup in the disposable database
        env:
          LOCAL_OPERATION_GUARD_TEST: "1"
          PGPORT: "54322"
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p "$PGPORT" -U postgres -d postgres -v ON_ERROR_STOP=1 -f nextjs/scripts/db/install-operation-guard-maintenance.sql
          psql -h 127.0.0.1 -p "$PGPORT" -U postgres -d postgres -v ON_ERROR_STOP=1 -f nextjs/scripts/db/install-operation-guard-maintenance.sql
          node nextjs/scripts/db/verify-operation-guard-maintenance.mjs

      # Dumped and uploaded before the tests run, so a red pgTAP suite still leaves the
      # orchestrator the schema it needs for the read-only diff against production (L-2).
      - name: Dump the schema the migrations produced
        run: supabase db dump --local --schema public -f "schema-after-${{ steps.chain.outputs.head }}.sql"

      - name: Fingerprint the full chain
        run: |
          eval "$(supabase status --output env | grep '^DB_URL=')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -F "$(printf '\t')" \
            -f nextjs/scripts/db/catalog-fingerprints.sql > /tmp/fingerprints-head.tsv
          jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {kind: .[0], object: .[1], fingerprint: .[2]})' \
            /tmp/fingerprints-head.tsv > "fingerprints-after-${{ steps.chain.outputs.head }}.json"
          echo "fingerprint rows: $(jq 'length' "fingerprints-after-${{ steps.chain.outputs.head }}.json")"

      - uses: actions/upload-artifact@v4
        with:
          name: schema-after-${{ steps.chain.outputs.head }}
          path: schema-after-${{ steps.chain.outputs.head }}.sql
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fingerprints-after-${{ steps.chain.outputs.head }}
          path: fingerprints-after-${{ steps.chain.outputs.head }}.json
          retention-days: 30
          if-no-files-found: error

      # pgTAP is what every fixture's plan()/ok() lives in. Creating it is idempotent and the
      # official docs never confirmed the local image ships it enabled, so this asks rather
      # than assumes -- and it is a CLI call, not a new dependency.
      - name: Run the pgTAP suite
        id: pgtap-first
        run: |
          supabase db query --local "create extension if not exists pgtap with schema extensions;"
          supabase test db

      # The repair migrations are required to be re-runnable (USKC DB qualification contract,
      # expand/contract discipline). "Idempotent by construction" is a claim; applying them a second
      # time to the finished database and re-running the whole suite is the measurement. A migration
      # that is not re-runnable errors here, and one that is re-runnable but changes state turns the
      # suite red on the second pass. Only the repair files are replayed: 0001-0051 predate this
      # rule and several of them are deliberately create-once.
      #
      # The 2026-09-11 migrations join the replay (both lanes asked for this, and both argued their
      # files are idempotent by construction -- `create or replace`, `add column if not exists`,
      # `drop constraint if exists` + `add`, and no data statement at all). This is what turns that
      # argument into a measurement. The glob stays `20260911*` and is deliberately not `2026*`:
      # the four `20260909*` connector migrations are `create table` without `if not exists` and
      # are correctly create-once.
      #
      # 0053 is also excluded: its global service_role revoke/regrant matrix predates later table
      # grants, so replaying it would erase those grants and leave the rehearsal in a state that a
      # sequential production migration never reaches.
      # The runner-local ACL and async authority drafts are excluded from this replay loop: they
      # intentionally include create-once schema statements. They are each applied once by the
      # disposable db reset, and their pgTAP tests run before and after the replay-safe repair set.
      # The old deletion-inventory migrations are not replayed here: 20260927102000 supersedes
      # their function bodies for uploaded sources. Replaying them after that create-once migration
      # would silently restore connector-only inventory logic. The first pass and pgTAP suite still
      # exercise the complete migration chain.
      - name: Apply the repair migrations a second time and re-run the suite
        id: pgtap-second
        run: |
          eval "$(supabase status --output env | grep '^DB_URL=')"
          for file in supabase/migrations/005[245]_*.sql supabase/migrations/20260911*_*.sql \
                      supabase/migrations/20260929152100_*.sql \
                      supabase/migrations/20261002110000_*.sql \
                      supabase/migrations/20261002130000_*.sql; do
            echo "replaying $file"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done
          supabase test db

      # Last on purpose: the race commits synthetic budgets, reservations and append-only ledger
      # rows it cannot remove, so it must follow every pgTAP pass. Loopback, port and password do
      # not prove the target is disposable, so this step writes a fresh random marker into the
      # stack `supabase status` names, and the script refuses to write unless its own connection
      # finds that marker. psql is the runner's /usr/bin/psql, pinned inside the script.
      - name: Race model-provider settlement against another tenant's reserve on the disposable database
        env:
          MODEL_PROVIDER_SPEND_RACE_TEST: "1"
          PGPORT: "54322"
          PGPASSWORD: postgres
        run: |
          eval "$(supabase status --output env | grep '^DB_URL=')"
          marker="tavonel-disposable-$(cat /proc/sys/kernel/random/uuid)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "create schema tavonel_ci_fixture;" \
            -c "create table tavonel_ci_fixture.disposable_marker (value text primary key);" \
            -c "insert into tavonel_ci_fixture.disposable_marker values ('$marker');"
          MODEL_PROVIDER_SPEND_RACE_MARKER="$marker" node nextjs/scripts/db/model-provider-spend-race.mjs

      - name: Require both disposable pgTAP passes for the completed-read draft
        if: always() && steps.completed-read-draft.outputs.state != 'absent'
        env:
          COMPLETED_READ_STAGE_RESULT: ${{ steps.completed-read-draft.outcome }}
          COMPLETED_READ_STATE: ${{ steps.completed-read-draft.outputs.state }}
          FIRST_PGTAP_RESULT: ${{ steps.pgtap-first.outcome }}
          SECOND_PGTAP_RESULT: ${{ steps.pgtap-second.outcome }}
        run: node nextjs/scripts/repair-scope-gate.mjs database-draft

  real-auth-journey:
    name: Real local Auth journey
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      # Same hypothesis-driven ephemeral-port exclusion as db-rehearsal (see there);
      # `supabase start` binds 54321-54329.
      - name: Keep the local stack ports out of this runner's ephemeral range
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          key=/proc/sys/net/ipv4/ip_local_reserved_ports
          before="$(cat "$key")"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${before:+$before,}54320-54329"
          after="$(cat "$key")"
          echo "reserved before='$before' after='$after'"
          covered() { echo "$after" | tr ',' '\n' | awk -F- -v p="$1" 'NF { hi = ($2 == "" ? $1 : $2); if (p >= $1 && p <= hi) f = 1 } END { exit !f }'; }
          for port in $(seq 54320 54329) $(echo "$before" | tr ',-' '  '); do covered "$port"; done
          ss -Htanp '( sport >= :54320 and sport <= :54329 )' || true
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Use official Docker Hub images for this disposable stack
        run: echo 'SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io' >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the existing frozen Foundation dependencies
        working-directory: nextjs
        run: pnpm install --frozen-lockfile
      - name: Preserve the existing Foundation validation gates
        working-directory: nextjs
        run: |
          pnpm scan:secrets
          pnpm check
          pnpm test
          node --test scripts/journey/real-auth-ci-contract.test.mjs scripts/journey/stop-owned-child.test.mjs
      - name: Start genuine Auth in the disposable local Supabase stack
        run: |
          test ! -f supabase/config.toml
          supabase init
          grep -qx 'major_version = 17' supabase/config.toml
          # Only this newly created runner-local configuration changes. No project is linked.
          python3 - <<'PY'
          from pathlib import Path
          import re
          config = Path('supabase/config.toml')
          original = config.read_text()
          updated, count = re.subn(r'^jwt_expiry = [0-9]+$', 'jwt_expiry = 60', original, flags=re.M)
          assert count == 1, 'Expected the pinned CLI default Auth lifetime field'
          config.write_text(updated)
          PY
          ss -Htanp '( sport >= :54320 and sport <= :54329 )' || true
          supabase start
          supabase status --output json > "$RUNNER_TEMP/tavonel-auth-status.json"
          chmod 600 "$RUNNER_TEMP/tavonel-auth-status.json"
      - name: Fetch only the official checksum-qualified portable local S3 runtime
        run: |
          mkdir -p "$RUNNER_TEMP/tavonel-auth-runtime"
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/seaweedfs/seaweedfs/releases/download/4.48/linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/tavonel-auth-runtime/release.tar.gz"
          echo "4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124  $RUNNER_TEMP/tavonel-auth-runtime/release.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tavonel-auth-runtime/release.tar.gz" -C "$RUNNER_TEMP/tavonel-auth-runtime" weed
          echo "8c07a1ccc4ec058cd90989ac0533c30436832e41c63de2b26f37253d9f744c4d  $RUNNER_TEMP/tavonel-auth-runtime/weed" | sha256sum --check
          chmod +x "$RUNNER_TEMP/tavonel-auth-runtime/weed"
      - name: Install one isolated Chromium runtime
        working-directory: nextjs
        run: pnpm exec playwright install --with-deps chromium
      - name: Qualify real provider login, interrupted callback, refresh, logout and selected-revision UI
        working-directory: nextjs
        run: |
          export TAVONEL_AUTH_STACK_STATUS="$RUNNER_TEMP/tavonel-auth-status.json"
          export TAVONEL_LOCAL_SEAWEED_EXE="$RUNNER_TEMP/tavonel-auth-runtime/weed"
          node scripts/journey/real-auth-ci-journey.mjs
      - name: Preserve only the redacted qualification ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-auth-journey-${{ github.sha }}
          path: nextjs/output/real-auth-journey.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop only the runner's disposable local stack
        if: always()
        run: |
          supabase stop --no-backup
          rm -f "$RUNNER_TEMP/tavonel-auth-status.json"

  # On Windows, actual Chromium + SeaweedFS 4.48 left both valid signed PUTs hanging and the S3
  # gateway never reported ready, so the transport is unqualified there. This proposes Linux as the
  # runner; a log here is the evidence, not this comment. Loopback only: no Supabase stack, no
  # secret, no database credentials. The harness creates its own disposable keys and S3.
  browser-storage-transport:
    name: Local Chromium signed-storage transport
    needs: [collector-only-eligibility]
    if: always() && github.event_name == 'pull_request' && (needs.collector-only-eligibility.result != 'success' || needs.collector-only-eligibility.outputs.eligible != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the existing frozen Foundation dependencies
        working-directory: nextjs
        run: pnpm install --frozen-lockfile
      - name: Install one isolated Chromium runtime
        working-directory: nextjs
        run: pnpm exec playwright install --with-deps chromium
      - name: Fetch only the official checksum-qualified portable local S3 runtime
        run: |
          mkdir -p "$RUNNER_TEMP/tavonel-transport-runtime"
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/seaweedfs/seaweedfs/releases/download/4.48/linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/tavonel-transport-runtime/release.tar.gz"
          echo "4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124  $RUNNER_TEMP/tavonel-transport-runtime/release.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tavonel-transport-runtime/release.tar.gz" -C "$RUNNER_TEMP/tavonel-transport-runtime" weed
          echo "8c07a1ccc4ec058cd90989ac0533c30436832e41c63de2b26f37253d9f744c4d  $RUNNER_TEMP/tavonel-transport-runtime/weed" | sha256sum --check
          chmod +x "$RUNNER_TEMP/tavonel-transport-runtime/weed"
      - name: Qualify actual Chromium signed PUT, CORS, refusal, redirect and host guards against actual local S3
        working-directory: nextjs
        # Disposable SeaweedFS data and TLS fixtures on the runner's temp area (SeaweedFS needs >=1% free there).
        env:
          TAVONEL_LOCAL_S3_TMPDIR: ${{ runner.temp }}
        run: |
          export TAVONEL_LOCAL_SEAWEED_EXE="$RUNNER_TEMP/tavonel-transport-runtime/weed"
          node scripts/journey/local-browser-storage-transport-journey.mjs
