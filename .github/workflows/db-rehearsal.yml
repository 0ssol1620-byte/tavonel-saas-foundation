# Does 0001 to the head migration still apply to an empty database, and does the RLS matrix hold?
#
# Neither question had ever been answered. Production's migration history records 0001,
# 0020-0023 and 0038-0048 only, while tables from 0002-0037 exist (gap matrix L-2), so the
# schema cannot be derived from the history, and `supabase/tests/*.sql` had never executed
# anywhere because the build machine has no Docker (customer-data gate, precondition 1).
#
# A GitHub runner has Docker. That is the whole trick: `supabase db start` applies every file
# under supabase/migrations in filename order to a throwaway Postgres 17, so a job log here is
# the rehearsal receipt, and a failure in that step IS the finding rather than a broken build.
#
# No secret, no project ref, no access token, no db URL of the live project. This job must never
# be able to reach it -- it proves what the files say, not what production happens to contain.
name: DB rehearsal

on:
  pull_request:
  push:
    branches: [main, "agent/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: db-rehearsal-${{ github.ref }}
  cancel-in-progress: true

env:
  # The last version production's own migration history records (gap matrix L-2). Fingerprinting
  # the chain truncated here is the half of the G-9 condition-2 comparison that can be produced
  # from the files; production supplies the other half, read-only, later. It is a boundary fact
  # about production, not a count of this folder -- which is why it is pinned and the head is not.
  HISTORY_BOUNDARY: "0048"

jobs:
  collector-only-eligibility:
    name: Verify exact collector-only DB evidence reuse
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      intended: ${{ steps.scope.outputs.intended }}
      native_database: ${{ steps.scope.outputs.native_database }}
      native_race: ${{ steps.scope.outputs.native_race }}
      affected: ${{ steps.scope.outputs.affected }}
      affected_database: ${{ steps.scope.outputs.affected_database }}
      affected_database_tests: ${{ steps.scope.outputs.affected_database_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independently verify unchanged DB source and prior evidence
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTOR_EVENT: ${{ github.event_name }}
          REPAIR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node nextjs/scripts/repair-collector-only.mjs eligibility
      - name: Require an explicit collector classifier decision
        id: decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLASSIFIER_RESULT: ${{ steps.scope.outcome }}
          INTENDED_RESULT: ${{ steps.scope.outputs.intended }}
          ELIGIBLE_RESULT: ${{ steps.scope.outputs.eligible }}
          NATIVE_DATABASE_RESULT: ${{ steps.scope.outputs.native_database }}
          NATIVE_RACE_RESULT: ${{ steps.scope.outputs.native_race }}
          REPAIR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const env = process.env;
          const { nativeDbJobDecision, nativeRaceDecisionHolds, authenticateFailedNativeResolution } = await import('./nextjs/scripts/repair-collector-only.mjs');
          const decision = nativeDbJobDecision({classifierResult:env.CLASSIFIER_RESULT,intended:env.INTENDED_RESULT,eligible:env.ELIGIBLE_RESULT,nativeDatabase:env.NATIVE_DATABASE_RESULT,nativeRace:env.NATIVE_RACE_RESULT});
          // The exact native World race disposition is re-derived from the head: no DB/Auth/transport rerun and no DB inheritance.
          const explicit = decision.explicit && nativeRaceDecisionHolds({headSha:env.REPAIR_HEAD_SHA,nativeRace:env.NATIVE_RACE_RESULT,decision});
          if (explicit && decision.disposition) console.log(JSON.stringify({ databaseDisposition: decision.disposition, runDatabase: decision.runDatabase, runTransport: decision.runTransport, databaseInherited: false, fullQualification: 'pending' }));
          if (!explicit) {
            const fullDebt = ['PR-base full CI', 'PR-base full Launch QA', 'Lighthouse', 'full release build and exact Foundation/Core pair'];
            if (!existsSync('collector-only-failure-receipt.json')) writeFileSync('collector-only-failure-receipt.json', JSON.stringify({ headSha: env.REPAIR_HEAD_SHA, gate: 'failed', gateFailures: ['Missing, failed or unqualified collector classification'], fullQualification: 'pending', runResults: { 'collector-only-eligibility': 'unqualified' }, inheritedChecks: {}, pendingDebt: ['hermetic-vitest-71-failures-triage'], knownRegressionObservations: [{ sourceHead: 'e402e61c9ea7d2ecbabe8aeb35144055c2b7b540', runId: 37330362300, jobId: 111831591345, passed: 6407, failed: 71, skipped: 1, files: 442, failingFiles: 17, affectedness: 'pending independent log-only triage' }] }, null, 2) + '\n');
            let receipt = JSON.parse(readFileSync('collector-only-failure-receipt.json', 'utf8'));
            receipt.pendingFullDebt = [...new Set([...(receipt.pendingFullDebt ?? []), ...fullDebt])];
            receipt.pendingDebt = [...new Set([...(receipt.pendingDebt ?? []), 'database-contract', 'hermetic-vitest-71-failures-triage'])];
            receipt.databaseObservation = 'not executed; inherited evidence unaccepted';
            receipt.inheritedChecks = {};
            if (env.INTENDED_RESULT === 'true' && env.ELIGIBLE_RESULT === 'false' && ['8956734a6675ae79d5081e77f551e0cb49cf8a39', '8682045bce5ad550abe2ad7d5376130b95651972', '2d678803af9fe0c6ee49ebe3065265696a726ca2', '7d4bdac08041f282616ba85a25e8938a29230759', '203d14c615a99617e9073bfea3b2a281952f9b8f'].includes(receipt.collectorOnlyFailure?.intent?.parent)) {
              const { authenticateFailedIntakeResolution } = await import('./nextjs/scripts/repair-known-regression.mjs');
              receipt = authenticateFailedIntakeResolution(receipt, { headSha: env.REPAIR_HEAD_SHA, intendedResult: env.INTENDED_RESULT, eligibleResult: env.ELIGIBLE_RESULT });
            }
            receipt = authenticateFailedNativeResolution(receipt, {headSha:env.REPAIR_HEAD_SHA,intended:env.INTENDED_RESULT});
            writeFileSync('collector-only-failure-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
            process.exit(1);
          }
          NODE
      - name: Preserve the failed collector eligibility receipt
        if: always() && steps.decision.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: collector-only-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: collector-only-failure-receipt.json
          if-no-files-found: error
          retention-days: 30
  db-rehearsal:
    name: db-rehearsal
    needs: [collector-only-eligibility]
    # Qualified native scope runs a fresh DB; invalid/missing classification blocks expensive jobs.
    if: >-
      always() && needs.collector-only-eligibility.result == 'success' &&
      ((needs.collector-only-eligibility.outputs.native_database == 'true' && needs.collector-only-eligibility.outputs.intended == 'true' && needs.collector-only-eligibility.outputs.eligible == 'false') ||
       (needs.collector-only-eligibility.outputs.affected != 'true' && needs.collector-only-eligibility.outputs.native_database == 'false' && needs.collector-only-eligibility.outputs.intended == 'false' && needs.collector-only-eligibility.outputs.eligible == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Manual run 36803612422 failed on a fresh runner: right after the image pull, Docker could
      # not bind 0.0.0.0:54322 ("address already in use"), before any SQL ran. The socket's owner
      # was not recorded, so the cause is unproven. Hypothesis: 54320-54329 lie inside Linux's
      # default ephemeral range (32768-60999), so an earlier outbound connection on this runner
      # (checkout, the parallel layer pull) may be handed one as its source port. Mitigation:
      # exclude them from automatic source-port allocation, on GitHub-hosted disposable runners
      # only, appending to (never replacing) any existing reservation. Explicit binds (the local
      # stack) still work. The CLI default ports stay, because real-auth-ci-contract.mjs accepts
      # only them. Nothing is stopped or killed; `ss` records any holder before the bind.
      - name: Keep the local stack ports out of this runner's ephemeral range
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          key=/proc/sys/net/ipv4/ip_local_reserved_ports
          before="$(cat "$key")"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${before:+$before,}54320-54329"
          after="$(cat "$key")"
          echo "reserved before='$before' after='$after'"
          covered() { echo "$after" | tr ',' '\n' | awk -F- -v p="$1" 'NF { hi = ($2 == "" ? $1 : $2); if (p >= $1 && p <= hi) f = 1 } END { exit !f }'; }
          for port in $(seq 54320 54329) $(echo "$before" | tr ',-' '  '); do covered "$port"; done
          ss -Htanp '( sport >= :54320 and sport <= :54329 )' || true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Revalidate exact native scope before disposable database setup
        if: needs.collector-only-eligibility.outputs.native_database == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUIRE_NATIVE_DB_SCOPE: "1"
        run: node nextjs/scripts/repair-collector-only.mjs eligibility

      # Pinned to the version the repository already runs locally. `latest` would let a CLI
      # release change what this receipt means without a commit saying so.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # setup-cli selects GHCR by default. GHCR throttled this public image on four fresh
      # runners, including one authenticated pull, before any SQL ran. The same pinned
      # supabase/postgres:17.6.1.165 tag is published on Docker Hub (digest verified at the
      # registry). Override the setup action for all subsequent local-CLI steps.
      - name: Use the official Docker Hub image registry for the local stack
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"


      # The repository carries migrations and tests but no config.toml, because the CLI's
      # config is local-stack tooling rather than schema. `init` writes it and needs no Docker.
      # The grep is the assertion: Postgres 17 is what production runs, so a rehearsal on any
      # other major version proves nothing about it.
      - name: Create the local stack config
        run: |
          test -f supabase/config.toml || supabase init
          grep -qx 'major_version = 17' supabase/config.toml
      # The ACL pgTAP file is intentionally checked in beside its SQL draft, not as a production
      # migration. `supabase test db` discovers every file under supabase/tests, while db reset
      # only applies supabase/migrations; without this runner-local bridge that test would run
      # against a schema with no ACL functions/table. Create a timestamp using the pinned official
      # CLI, then copy the exact reviewed draft into that generated file. The checkout and local
      # Postgres stack are disposable; this file is never committed, pushed, or applied remotely.
      - name: Stage the reviewed ACL draft as a runner-local migration
        id: acl-draft
        run: |
          set -euo pipefail
          draft=supabase/drafts/google-viewer-principal-boundary.sql
          test_file=supabase/tests/google_viewer_principal_boundary.sql
          if [[ ! -e "$draft" && ! -e "$test_file" ]]; then
            echo "Neither ACL draft nor its pgTAP test is present; no temporary migration needed."
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$draft"
          test -f "$test_file"

          shopt -s nullglob
          existing=(supabase/migrations/*_google_viewer_principal_boundary.sql)
          if ((${#existing[@]} > 0)); then
            test "${#existing[@]}" -eq 1
            acl_path="${existing[0]}"
            [[ "$(basename "$acl_path")" =~ ^([0-9]{14})_google_viewer_principal_boundary\.sql$ ]]
            echo "A repository migration already registers this ACL test schema; normal db reset applies it."
            echo "state=registered" >> "$GITHUB_OUTPUT"
            echo "path=$acl_path" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          supabase migration new --help
          supabase migration new google_viewer_principal_boundary
          generated=(supabase/migrations/*_google_viewer_principal_boundary.sql)
          test "${#generated[@]}" -eq 1
          [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_google_viewer_principal_boundary\.sql$ ]]
          acl_version="${BASH_REMATCH[1]}"
          cp -- "$draft" "${generated[0]}"
          cmp -- "$draft" "${generated[0]}"
          sha256sum "$draft" "${generated[0]}"
          echo "state=ephemeral" >> "$GITHUB_OUTPUT"
          echo "path=${generated[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$acl_version" >> "$GITHUB_OUTPUT"

      # The refresh queue is an unregistered draft that depends on the verified ACL boundary
      # schema. It is copied only into the throwaway database chain after that boundary.
      - name: Stage the reviewed Google Drive ACL refresh after ACL boundary
        id: acl-refresh-draft
        run: |
          set -euo pipefail
          boundary_draft=supabase/drafts/google-viewer-principal-boundary.sql
          draft=supabase/drafts/google-drive-acl-refresh/queue.sql
          test_source=supabase/drafts/google-drive-acl-refresh/tests/google_drive_acl_refresh_queue.sql
          test_target=supabase/tests/google_drive_acl_refresh_queue.sql
          if [[ ! -e "$draft" && ! -e "$test_source" ]]; then
            echo "Neither Google Drive ACL refresh draft nor its pgTAP test is present; no temporary migration needed."
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$boundary_draft"
          test -f "$draft"
          test -f "$test_source"
          boundary_state='${{ steps.acl-draft.outputs.state }}'
          boundary_version='${{ steps.acl-draft.outputs.version }}'
          if [[ "$boundary_state" == absent || ! "$boundary_version" =~ ^[0-9]{14}$ ]]; then
            echo "ACL refresh draft requires the ACL boundary draft to be staged first." >&2
            exit 1
          fi

          expected_boundary_sha256=8aad3ffaf8d3062c764988029a1235db4e04ab181e0211524677f9f213e306bc
          expected_queue_sha256=04b75937e204db4da659352c6f9194c110018cd45715c72553ee0e2e41e8c4a8
          expected_test_sha256=ecc2b851051b7bbccaed09b231e44a9dcc4fabf6483f6b572fafe3488c1177e2
          test "$(sha256sum "$boundary_draft" | cut -d ' ' -f 1)" = "$expected_boundary_sha256"
          test "$(sha256sum "$draft" | cut -d ' ' -f 1)" = "$expected_queue_sha256"
          test "$(sha256sum "$test_source" | cut -d ' ' -f 1)" = "$expected_test_sha256"
          printf '%s  %s\n' "$expected_boundary_sha256" "$boundary_draft" | sha256sum --check
          printf '%s  %s\n' "$expected_queue_sha256" "$draft" | sha256sum --check
          printf '%s  %s\n' "$expected_test_sha256" "$test_source" | sha256sum --check

          shopt -s nullglob
          existing=(supabase/migrations/*_google_drive_acl_refresh_queue.sql)
          if (("${#existing[@]}" > 0)); then
            echo "The Google Drive ACL refresh SQL must remain an unregistered draft during this phase." >&2
            exit 1
          fi
          test ! -e "$test_target"

          # Create a runner-local successor to the ACL boundary migration.
          now_version="$(date -u +%Y%m%d%H%M%S)"
          if [[ "$boundary_version" > "$now_version" ]]; then
            echo "ACL boundary migration version is in the future; cannot generate a later ACL refresh migration now." >&2
            exit 1
          fi
          while [[ ! "$now_version" > "$boundary_version" ]]; do
            sleep 1
            now_version="$(date -u +%Y%m%d%H%M%S)"
          done
          supabase migration new google_drive_acl_refresh_queue
          generated=(supabase/migrations/*_google_drive_acl_refresh_queue.sql)
          test "${#generated[@]}" -eq 1
          [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_google_drive_acl_refresh_queue\.sql$ ]]
          refresh_version="${BASH_REMATCH[1]}"
          [[ "$refresh_version" > "$boundary_version" ]]
          cp -- "$draft" "${generated[0]}"
          cmp -- "$draft" "${generated[0]}"
          printf '%s  %s\n' "$expected_queue_sha256" "$draft" "$expected_queue_sha256" "${generated[0]}" | sha256sum --check
          cp -- "$test_source" "$test_target"
          cmp -- "$test_source" "$test_target"
          printf '%s  %s\n' "$expected_test_sha256" "$test_source" "$expected_test_sha256" "$test_target" | sha256sum --check
          echo "state=ephemeral" >> "$GITHUB_OUTPUT"
          echo "path=${generated[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$refresh_version" >> "$GITHUB_OUTPUT"

      # Keep the async authority SQL a draft in the repository. This ordered runner-local copy
      # exercises it only after the ACL35 schema/helper draft; the version assertion makes that
      # dependency visible in the exact disposable migration chain. No production migration is
      # registered, and both source and generated file hashes are printed for the rehearsal log.
      - name: Stage the reviewed async authority draft after ACL
        id: async-authority-draft
        run: |
          set -euo pipefail
          draft=supabase/drafts/compile-job-viewer-authority.sql
          test_file=supabase/tests/compile_job_viewer_authority.sql
          if [[ ! -e "$draft" && ! -e "$test_file" ]]; then
            echo "Neither async authority draft nor its pgTAP test is present; no temporary migration needed."
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$draft"
          test -f "$test_file"
          acl_state='${{ steps.acl-draft.outputs.state }}'
          acl_version='${{ steps.acl-draft.outputs.version }}'
          refresh_state='${{ steps.acl-refresh-draft.outputs.state }}'
          refresh_version='${{ steps.acl-refresh-draft.outputs.version }}'
          order_version="$acl_version"
          if [[ "$refresh_state" == ephemeral ]]; then
            if [[ ! "$refresh_version" =~ ^[0-9]{14}$ ]]; then
              echo "ACL refresh stage returned no ordered migration version." >&2
              exit 1
            fi
            order_version="$refresh_version"
          elif [[ "$refresh_state" != absent ]]; then
            echo "ACL refresh stage returned an unexpected state." >&2
            exit 1
          fi
          if [[ "$acl_state" == absent || ! "$order_version" =~ ^[0-9]{14}$ ]]; then
            echo "Async authority draft requires the ACL draft migration to be present first." >&2
            exit 1
          fi

          shopt -s nullglob
          existing=(supabase/migrations/*_compile_job_viewer_authority.sql)
          if ((${#existing[@]} > 0)); then
            echo "The async authority SQL must remain an unregistered draft during this phase." >&2
            exit 1
          fi

          # The CLI versions migrations to the current UTC second. Wait for the last staged
          # ACL dependency's successor second so equal-version artifacts cannot reverse order.
          now_version="$(date -u +%Y%m%d%H%M%S)"
          if [[ "$order_version" > "$now_version" ]]; then
            echo "ACL dependency version is in the future; cannot generate a later disposable migration now." >&2
            exit 1
          fi
          while [[ ! "$now_version" > "$order_version" ]]; do
            sleep 1
            now_version="$(date -u +%Y%m%d%H%M%S)"
          done
          supabase migration new compile_job_viewer_authority
          generated=(supabase/migrations/*_compile_job_viewer_authority.sql)
          test "${#generated[@]}" -eq 1
          [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_compile_job_viewer_authority\.sql$ ]]
          async_version="${BASH_REMATCH[1]}"
          [[ "$async_version" > "$order_version" ]]
          cp -- "$draft" "${generated[0]}"
          cmp -- "$draft" "${generated[0]}"
          sha256sum "$draft" "${generated[0]}"
          echo "state=ephemeral" >> "$GITHUB_OUTPUT"
          echo "path=${generated[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$async_version" >> "$GITHUB_OUTPUT"

      # The intake triage schema stays in drafts. Copy it only into this GitHub-hosted,
      # throwaway Postgres rehearsal, after the existing ACL and async authority drafts.
      # The named constraint and schema objects must be exercised after their prerequisites.
      - name: Stage the reviewed intake triage draft after async authority
        id: intake-triage-draft
        run: |
          set -euo pipefail
          draft=supabase/drafts/migrations/20261004120000_foundation_intake_triage_v3.sql
          test_source=supabase/drafts/tests/foundation_intake_triage_binding.sql
          test_target=supabase/tests/foundation_intake_triage_binding.sql
          if [[ ! -e "$draft" && ! -e "$test_source" ]]; then
            echo "Neither intake triage draft nor its pgTAP test is present; no temporary migration needed."
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$draft"
          test -f "$test_source"
          test ! -e "$test_target"
          async_state='${{ steps.async-authority-draft.outputs.state }}'
          async_version='${{ steps.async-authority-draft.outputs.version }}'
          if [[ "$async_state" == absent || ! "$async_version" =~ ^[0-9]{14}$ ]]; then
            echo "Intake triage rehearsal requires ACL and async authority staging first." >&2
            exit 1
          fi

          expected_migration_sha256=092247c80b04e861471cb04edf7ba22699ebc7bbf81cb067b6840724ebb7a00e
          expected_test_sha256=f142517c4432668cc291abf7ed3942976a373149c3842dfc45a1ead534cefda0
          test "$(sha256sum "$draft" | cut -d ' ' -f 1)" = "$expected_migration_sha256"
          test "$(sha256sum "$test_source" | cut -d ' ' -f 1)" = "$expected_test_sha256"
          printf '%s  %s\n' "$expected_test_sha256" "$test_source" | sha256sum --check

          shopt -s nullglob
          existing=(supabase/migrations/*_foundation_intake_triage_v3.sql)
          test "${#existing[@]}" -eq 0
          now_version="$(date -u +%Y%m%d%H%M%S)"
          if [[ "$async_version" > "$now_version" ]]; then
            echo "Async authority migration version is in the future; cannot generate a later intake migration now." >&2
            exit 1
          fi
          while [[ ! "$now_version" > "$async_version" ]]; do
            sleep 1
            now_version="$(date -u +%Y%m%d%H%M%S)"
          done
          supabase migration new foundation_intake_triage_v3
          generated=(supabase/migrations/*_foundation_intake_triage_v3.sql)
          test "${#generated[@]}" -eq 1
          [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_foundation_intake_triage_v3\.sql$ ]]
          intake_version="${BASH_REMATCH[1]}"
          [[ "$intake_version" > "$async_version" ]]
          cp -- "$draft" "${generated[0]}"
          cmp -- "$draft" "${generated[0]}"
          printf '%s  %s\n' "$expected_migration_sha256" "$draft" "$expected_migration_sha256" "${generated[0]}" | sha256sum --check
          cp -- "$test_source" "$test_target"
          cmp -- "$test_source" "$test_target"
          printf '%s  %s\n' "$expected_test_sha256" "$test_source" "$expected_test_sha256" "$test_target" | sha256sum --check
          echo "state=ephemeral" >> "$GITHUB_OUTPUT"
          echo "path=${generated[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$intake_version" >> "$GITHUB_OUTPUT"

      # Completed-read proof remains a create-once draft in this disposable checkout.
      # Stage after all current schema/draft prerequisites; never add it to production discovery or replay.
      - name: Stage the exact completed-read producer draft after intake triage
        id: completed-read-draft
        run: |
          set -euo pipefail
          draft=supabase/drafts/migrations/20261005130000_foundation_completed_read_proof.sql
          test_source=supabase/drafts/tests/foundation_completed_read_proof.sql
          test_target=supabase/tests/foundation_completed_read_proof.sql
          if [[ ! -e "$draft" && ! -e "$test_source" ]]; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$draft"
          test -f "$test_source"
          test ! -e "$test_target"
          intake_state='${{ steps.intake-triage-draft.outputs.state }}'
          intake_version='${{ steps.intake-triage-draft.outputs.version }}'
          test "$intake_state" = ephemeral
          [[ "$intake_version" =~ ^[0-9]{14}$ ]]
          expected_migration_sha256=c92a5656175ebac658af6e1246160bff462edac34dfa6534a304797f572c8163
          expected_test_sha256=3ef70e5c2d24aebaf67b06f89f86564e5b94d7154e8074dd2f8947693c129da1
          printf '%s  %s\n' "$expected_migration_sha256" "$draft" "$expected_test_sha256" "$test_source" | sha256sum --check
          shopt -s nullglob
          existing=(supabase/migrations/*_foundation_completed_read_proof.sql)
          test "${#existing[@]}" -eq 0
          now_version="$(date -u +%Y%m%d%H%M%S)"
          if [[ "$intake_version" > "$now_version" ]]; then
            echo "Intake version is in the future; refusing an unordered completed-read draft." >&2
            exit 1
          fi
          while [[ ! "$now_version" > "$intake_version" ]]; do
            sleep 1
            now_version="$(date -u +%Y%m%d%H%M%S)"
          done
          supabase migration new --help
          supabase migration new foundation_completed_read_proof
          generated=(supabase/migrations/*_foundation_completed_read_proof.sql)
          test "${#generated[@]}" -eq 1
          [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_foundation_completed_read_proof\.sql$ ]]
          completed_read_version="${BASH_REMATCH[1]}"
          [[ "$completed_read_version" > "$intake_version" ]]
          cp -- "$draft" "${generated[0]}"
          cmp -- "$draft" "${generated[0]}"
          printf '%s  %s\n' "$expected_migration_sha256" "$draft" "$expected_migration_sha256" "${generated[0]}" | sha256sum --check
          cp -- "$test_source" "$test_target"
          cmp -- "$test_source" "$test_target"
          printf '%s  %s\n' "$expected_test_sha256" "$test_source" "$expected_test_sha256" "$test_target" | sha256sum --check
          echo "state=ephemeral" >> "$GITHUB_OUTPUT"
          echo "path=${generated[0]}" >> "$GITHUB_OUTPUT"
          echo "version=$completed_read_version" >> "$GITHUB_OUTPUT"


      # Native SQL is a create-once, unregistered draft in this disposable checkout.
      # The private positive fixture leaves the public candidate gate closed.
      - name: Stage exact native SQL drafts after completed-read
        id: native-sql-drafts
        env:
          NATIVE_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_SCOPE_REQUIRED: ${{ needs.collector-only-eligibility.outputs.native_database }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          migration_names=('native_source_ledger_snapshot' 'native_purpose_authority_schema' 'native_purpose_candidate_reader')
          migration_sources=('supabase/drafts/native-source-ledger-snapshot.sql' 'supabase/drafts/native-purpose-authority-schema.sql' 'supabase/drafts/native-purpose-candidate-reader.sql')
          migration_hashes=('08fc0baa0cf5f3776c91331218ca4cdf8e1ad41e688dc06c7363b5f85baec258' '976346877d4103d7f5c0ab14e560d2971370da4ebececd4dba909853c3fd3268' '84f2e7f54d484c7149237c15ede60df79ef688469da79c29e8b33ccc17ae75e2')
          test_names=('native_source_ledger_snapshot' 'native_purpose_authority_schema' 'native_purpose_candidate_reader' 'native_purpose_candidate_reader_correction')
          test_sources=('supabase/drafts/tests/native-source-ledger-snapshot.sql' 'supabase/drafts/tests/native-purpose-authority-schema.sql' 'supabase/drafts/tests/native-purpose-candidate-reader.sql' 'supabase/drafts/tests/native-purpose-candidate-reader-correction.sql')
          test_hashes=('dd462f0b0777310f06793661d3e96d9b3b91f47e6606233600f2997968e6074b' '381e50a775f2d93c0ae6b5757dedb38c3b9c834fe9aff8d8a21e824dd5b1a6fe' 'c5256a58200ac8e3122add1b7b887868d1a8e195256dd97e13ea7e5c54840c25' '5c30190276057bb2d4875d0e6f2c5984b6ec6b0d381e77e40ade64682eb9d58e')
          present=0
          for source in "${migration_sources[@]}" "${test_sources[@]}"; do
            if [[ -e "$source" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            test "$NATIVE_SCOPE_REQUIRED" != true
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$present" -eq 7
          if [[ "$NATIVE_SCOPE_REQUIRED" == true ]]; then test "$(git rev-parse HEAD)" = "$NATIVE_REQUESTED_HEAD"; fi
          for source in "${migration_sources[@]}" "${test_sources[@]}"; do test -f "$source"; done
          prerequisite_state='${{ steps.completed-read-draft.outputs.state }}'
          previous_version='${{ steps.completed-read-draft.outputs.version }}'
          test "$prerequisite_state" = ephemeral
          [[ "$previous_version" =~ ^[0-9]{14}$ ]]
          export NATIVE_CHECKOUT_HEAD="$(git rev-parse HEAD)"
          [[ "$NATIVE_REQUESTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$NATIVE_CHECKOUT_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test ! -e .native-sql-rehearsal-stage.tsv
          test ! -e .native-sql-rehearsal-stage.json
          shopt -s nullglob
          for i in 0 1 2; do
            name="${migration_names[$i]}"
            source="${migration_sources[$i]}"
            expected="${migration_hashes[$i]}"
            printf '%s  %s\n' "$expected" "$source" | sha256sum --check
            existing=(supabase/migrations/*_"$name".sql)
            test "${#existing[@]}" -eq 0
            now_version="$(date -u +%Y%m%d%H%M%S)"
            if [[ "$previous_version" > "$now_version" ]]; then
              echo "Native prerequisite version is in the future; refusing unordered staging." >&2
              exit 1
            fi
            while [[ ! "$now_version" > "$previous_version" ]]; do
              sleep 1
              now_version="$(date -u +%Y%m%d%H%M%S)"
            done
            supabase migration new "$name"
            generated=(supabase/migrations/*_"$name".sql)
            test "${#generated[@]}" -eq 1
            [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_"$name"\.sql$ ]]
            version="${BASH_REMATCH[1]}"
            [[ "$version" > "$previous_version" ]]
            cp -- "$source" "${generated[0]}"
            cmp -- "$source" "${generated[0]}"
            printf '%s  %s\n' "$expected" "${generated[0]}" | sha256sum --check
            printf '%s\t%s\t%s\t%s\t%s\n' migration "$source" "${generated[0]}" "$expected" "$version" >> .native-sql-rehearsal-stage.tsv
            previous_version="$version"
          done
          for i in 0 1 2 3; do
            source="${test_sources[$i]}"
            expected="${test_hashes[$i]}"
            target="supabase/tests/${test_names[$i]}.sql"
            test ! -e "$target"
            printf '%s  %s\n' "$expected" "$source" | sha256sum --check
            cp -- "$source" "$target"
            cmp -- "$source" "$target"
            printf '%s  %s\n' "$expected" "$target" | sha256sum --check
            printf '%s\t%s\t%s\t%s\t%s\n' test "$source" "$target" "$expected" - >> .native-sql-rehearsal-stage.tsv
          done
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const records = readFileSync('.native-sql-rehearsal-stage.tsv', 'utf8').trimEnd().split('\n').map(line => {
            const [kind, source, path, sha256, version] = line.split('\t');
            return { kind, source, path, sha256, version };
          });
          if (records.length !== 7) throw Error('Incomplete native staging receipt');
          writeFileSync('.native-sql-rehearsal-stage.json', JSON.stringify({
            schemaVersion: 1, state: 'ephemeral', requestedHead: process.env.NATIVE_REQUESTED_HEAD,
            checkoutHead: process.env.NATIVE_CHECKOUT_HEAD, records,
          }, null, 2) + '\n');
          NODE
          echo "state=ephemeral" >> "$GITHUB_OUTPUT"
          echo "version=$previous_version" >> "$GITHUB_OUTPUT"

      # Separate staging only: no selector/admission promotion or production gate change.
      # A self-contained pgTAP wrapper selects rollback-only unit mode; races are NOT run here.
      - name: Stage exact native World commit after native prerequisites
        id: native-world-sql-drafts
        env:
          WORLD_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          WORLD_PREREQUISITE_RESULT: ${{ steps.native-sql-drafts.outcome }}
          WORLD_PREREQUISITE_STATE: ${{ steps.native-sql-drafts.outputs.state }}
          WORLD_PREREQUISITE_VERSION: ${{ steps.native-sql-drafts.outputs.version }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          schema='supabase/drafts/native-world-reduction-commit.sql'
          fixture='supabase/drafts/tests/native-world-reduction-commit.sql'
          present=0
          for source in "$schema" "$fixture"; do if test -f "$source"; then present=$((present + 1)); fi; done
          if test "$present" -eq 0; then echo 'state=absent' >> "$GITHUB_OUTPUT"; exit 0; fi
          test "$present" -eq 2
          test "$WORLD_PREREQUISITE_RESULT" = success
          test "$WORLD_PREREQUISITE_STATE" = ephemeral
          export WORLD_CHECKOUT_HEAD="$(git rev-parse HEAD)"
          test "$WORLD_CHECKOUT_HEAD" = "$WORLD_REQUESTED_HEAD"
          printf '%s  %s\n' 'de039c9204ccb8fcefc659cdc090468ed3f8ae20d97fc18af96228e76897a4db' "$schema" '561d43d6f1f2a6c26a66e7e050db7b196d209939f337d2c773951d23f031cc62' "$fixture" | sha256sum --check
          previous_version="$(ls supabase/migrations/*.sql | sed 's#.*/##' | sed -E 's/^([0-9]+)_.*/\1/' | sort | tail -1)"
          test "$previous_version" = "$WORLD_PREREQUISITE_VERSION"
          shopt -s nullglob
          existing=(supabase/migrations/*_native_world_reduction_commit.sql)
          test "${#existing[@]}" -eq 0
          now_version="$(date -u +%Y%m%d%H%M%S)"
          if [[ "$previous_version" > "$now_version" ]]; then echo 'World prerequisite version is in the future' >&2; exit 1; fi
          while [[ ! "$now_version" > "$previous_version" ]]; do sleep 1; now_version="$(date -u +%Y%m%d%H%M%S)"; done
          supabase migration new native_world_reduction_commit
          generated=(supabase/migrations/*_native_world_reduction_commit.sql)
          test "${#generated[@]}" -eq 1
          [[ "$(basename "${generated[0]}")" =~ ^([0-9]{14})_native_world_reduction_commit\.sql$ ]]
          version="${BASH_REMATCH[1]}"
          [[ "$version" > "$previous_version" ]]
          cp -- "$schema" "${generated[0]}"
          cmp -- "$schema" "${generated[0]}"
          printf '%s  %s\n' 'de039c9204ccb8fcefc659cdc090468ed3f8ae20d97fc18af96228e76897a4db' "${generated[0]}" | sha256sum --check
          target='supabase/tests/native_world_reduction_commit.sql'
          test ! -e "$target"
          printf '%s\n' '\set ON_ERROR_STOP on' '\set world_disposable 1' '\set world_role unit' '\set world_case none' > "$target"
          cat -- "$fixture" >> "$target"
          cmp -- "$fixture" <(tail -n +5 "$target")
          printf '%s  %s\n' '04a09fc2de7f66193366f3002a31892bf60170c1252ccfe099ff55a6fa0ade5a' "$target" | sha256sum --check
          export WORLD_MIGRATION_PATH="${generated[0]}" WORLD_MIGRATION_VERSION="$version"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const env = process.env;
          const prerequisiteBytes = readFileSync('.native-sql-rehearsal-stage.json');
          const prerequisite = JSON.parse(prerequisiteBytes);
          if (prerequisite.schemaVersion !== 1 || prerequisite.state !== 'ephemeral' ||
              prerequisite.requestedHead !== env.WORLD_REQUESTED_HEAD || prerequisite.checkoutHead !== env.WORLD_CHECKOUT_HEAD ||
              prerequisite.records?.length !== 7 || prerequisite.records.filter(r => r.kind === 'migration').at(-1)?.version !== env.WORLD_PREREQUISITE_VERSION)
            throw Error('Exact native prerequisite staging required');
          writeFileSync('.native-world-sql-rehearsal-stage.json', JSON.stringify({
            schemaVersion: 1, state: 'ephemeral', requestedHead: env.WORLD_REQUESTED_HEAD, checkoutHead: env.WORLD_CHECKOUT_HEAD,
            prerequisiteStageSha256: createHash('sha256').update(prerequisiteBytes).digest('hex'),
            prerequisiteVersion: env.WORLD_PREREQUISITE_VERSION,
            records: [
              {kind: 'migration', source: 'supabase/drafts/native-world-reduction-commit.sql', path: env.WORLD_MIGRATION_PATH,
                sha256: 'de039c9204ccb8fcefc659cdc090468ed3f8ae20d97fc18af96228e76897a4db', copySha256: 'de039c9204ccb8fcefc659cdc090468ed3f8ae20d97fc18af96228e76897a4db', version: env.WORLD_MIGRATION_VERSION},
              {kind: 'unit-test', source: 'supabase/drafts/tests/native-world-reduction-commit.sql', path: 'supabase/tests/native_world_reduction_commit.sql',
                sha256: '561d43d6f1f2a6c26a66e7e050db7b196d209939f337d2c773951d23f031cc62', copySha256: '04a09fc2de7f66193366f3002a31892bf60170c1252ccfe099ff55a6fa0ade5a', version: '-'},
            ],
          }, null, 2) + '\n');
          NODE
          echo 'state=ephemeral' >> "$GITHUB_OUTPUT"

      # Artifact names are derived from the post-staging migration folder, so the schema
      # artifact is named by the exact temporary head that db reset will apply.
      - name: Read the head migration version out of the folder
        id: chain
        run: |
          head_version="$(ls supabase/migrations/*.sql | sed 's#.*/##' | sed -E 's/^([0-9]+)_.*/\1/' | sort | tail -1)"
          test -n "$head_version"
          echo "head=$head_version" >> "$GITHUB_OUTPUT"
          echo "head migration = $head_version, history boundary = $HISTORY_BOUNDARY"

      # Approach: move everything past the boundary aside and let `supabase db start` apply what
      # is left, then restore the files and re-apply the whole chain with `supabase db reset`.
      # Both commands exist in the pinned CLI 2.116.0 and neither needs a project ref. The
      # alternative -- copying 0001..0048 into a temporary folder -- would need the CLI to be
      # pointed at that folder, and 2.116.0 has no flag for that.
      #
      # DB_URL comes from `supabase status`, which prints the local stack's loopback connection
      # string (127.0.0.1, the container's own postgres/postgres). It is not a secret and it is
      # never echoed: the value is eval'd out of a pipeline and psql is handed the variable.
      - name: Apply the chain up to the history boundary and fingerprint it
        run: |
          mkdir -p /tmp/deferred-migrations
          for file in supabase/migrations/*.sql; do
            version="$(basename "$file" | sed -E 's/^([0-9]+)_.*/\1/')"
            if [ "$version" \> "$HISTORY_BOUNDARY" ]; then mv "$file" /tmp/deferred-migrations/; fi
          done
          # Evidence only: any socket still holding a stack port is printed before the bind.
          ss -Htanp '( sport >= :54320 and sport <= :54329 )' || true
          supabase db start
          eval "$(supabase status --output env | grep '^DB_URL=')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -F "$(printf '\t')" \
            -f nextjs/scripts/db/catalog-fingerprints.sql > /tmp/fingerprints-boundary.tsv
          jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {kind: .[0], object: .[1], fingerprint: .[2]})' \
            /tmp/fingerprints-boundary.tsv > "fingerprints-after-${HISTORY_BOUNDARY}.json"
          echo "fingerprint rows: $(jq 'length' "fingerprints-after-${HISTORY_BOUNDARY}.json")"

      - uses: actions/upload-artifact@v4
        with:
          name: fingerprints-after-${{ env.HISTORY_BOUNDARY }}
          path: fingerprints-after-${{ env.HISTORY_BOUNDARY }}.json
          retention-days: 30
          if-no-files-found: error

      - name: Restore the rest of the chain and apply every migration from empty
        run: |
          mv /tmp/deferred-migrations/*.sql supabase/migrations/
          rmdir /tmp/deferred-migrations
          supabase db reset

      - name: Print the resulting migration history
        run: supabase migration list --local

      - name: Exercise concurrent operation and contact admission on the disposable database
        env:
          LOCAL_OPERATION_GUARD_TEST: "1"
          PGPORT: "54322"
          PGPASSWORD: postgres
        run: node nextjs/scripts/db/operation-guard-race.mjs

      - name: Install and prove scheduled expiry cleanup in the disposable database
        env:
          LOCAL_OPERATION_GUARD_TEST: "1"
          PGPORT: "54322"
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p "$PGPORT" -U postgres -d postgres -v ON_ERROR_STOP=1 -f nextjs/scripts/db/install-operation-guard-maintenance.sql
          psql -h 127.0.0.1 -p "$PGPORT" -U postgres -d postgres -v ON_ERROR_STOP=1 -f nextjs/scripts/db/install-operation-guard-maintenance.sql
          node nextjs/scripts/db/verify-operation-guard-maintenance.mjs

      # Dumped and uploaded before the tests run, so a red pgTAP suite still leaves the
      # orchestrator the schema it needs for the read-only diff against production (L-2).
      - name: Dump the schema the migrations produced
        run: supabase db dump --local --schema public -f "schema-after-${{ steps.chain.outputs.head }}.sql"

      - name: Fingerprint the full chain
        run: |
          eval "$(supabase status --output env | grep '^DB_URL=')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -F "$(printf '\t')" \
            -f nextjs/scripts/db/catalog-fingerprints.sql > /tmp/fingerprints-head.tsv
          jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {kind: .[0], object: .[1], fingerprint: .[2]})' \
            /tmp/fingerprints-head.tsv > "fingerprints-after-${{ steps.chain.outputs.head }}.json"
          echo "fingerprint rows: $(jq 'length' "fingerprints-after-${{ steps.chain.outputs.head }}.json")"

      - uses: actions/upload-artifact@v4
        with:
          name: schema-after-${{ steps.chain.outputs.head }}
          path: schema-after-${{ steps.chain.outputs.head }}.sql
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fingerprints-after-${{ steps.chain.outputs.head }}
          path: fingerprints-after-${{ steps.chain.outputs.head }}.json
          retention-days: 30
          if-no-files-found: error

      # pgTAP is what every fixture's plan()/ok() lives in. Creating it is idempotent and the
      # official docs never confirmed the local image ships it enabled, so this asks rather
      # than assumes -- and it is a CLI call, not a new dependency.
      - name: Run the pgTAP suite
        id: pgtap-first
        run: |
          supabase db query --local "create extension if not exists pgtap with schema extensions;"
          supabase test db

      # The repair migrations are required to be re-runnable (USKC DB qualification contract,
      # expand/contract discipline). "Idempotent by construction" is a claim; applying them a second
      # time to the finished database and re-running the whole suite is the measurement. A migration
      # that is not re-runnable errors here, and one that is re-runnable but changes state turns the
      # suite red on the second pass. Only the repair files are replayed: 0001-0051 predate this
      # rule and several of them are deliberately create-once.
      #
      # The 2026-09-11 migrations join the replay (both lanes asked for this, and both argued their
      # files are idempotent by construction -- `create or replace`, `add column if not exists`,
      # `drop constraint if exists` + `add`, and no data statement at all). This is what turns that
      # argument into a measurement. The glob stays `20260911*` and is deliberately not `2026*`:
      # the four `20260909*` connector migrations are `create table` without `if not exists` and
      # are correctly create-once.
      #
      # 0053 is also excluded: its global service_role revoke/regrant matrix predates later table
      # grants, so replaying it would erase those grants and leave the rehearsal in a state that a
      # sequential production migration never reaches.
      # The runner-local ACL and async authority drafts are excluded from this replay loop: they
      # intentionally include create-once schema statements. They are each applied once by the
      # disposable db reset, and their pgTAP tests run before and after the replay-safe repair set.
      # The old deletion-inventory migrations are not replayed here: 20260927102000 supersedes
      # their function bodies for uploaded sources. Replaying them after that create-once migration
      # would silently restore connector-only inventory logic. The first pass and pgTAP suite still
      # exercise the complete migration chain.
      - name: Apply the repair migrations a second time and re-run the suite
        id: pgtap-second
        run: |
          eval "$(supabase status --output env | grep '^DB_URL=')"
          for file in supabase/migrations/005[245]_*.sql supabase/migrations/20260911*_*.sql \
                      supabase/migrations/20260929152100_*.sql \
                      supabase/migrations/20261002110000_*.sql \
                      supabase/migrations/20261002130000_*.sql; do
            echo "replaying $file"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done
          supabase test db

      # The path table pgTAP fixture proves ordered reconciliation, but runs in one transaction.
      # This runner-local two-session proof observes the competing generic insert waiting on the
      # OAuth row lock, then requires the committed canonical stream to reject it. The harness
      # stops its own psql sessions but deletes no rows: the canonical job writes append-only job
      # events, so its synthetic rows are deferred to this job's final disposable stack teardown.
      - name: Observe Dropbox canonical and generic job exclusion across two sessions
        if: hashFiles('supabase/migrations/20261007100000_dropbox_source_path_reconciliation.sql') != '' && hashFiles('supabase/tests/dropbox_source_reconciliation.sql') != ''
        timeout-minutes: 2
        run: node nextjs/scripts/db/dropbox-source-stream-race.mjs


      - name: Require both disposable pgTAP passes for exact native SQL
        id: native-sql-acceptance
        if: always() && (needs.collector-only-eligibility.outputs.native_database == 'true' || steps.native-sql-drafts.outputs.state != 'absent')
        env:
          NATIVE_STAGE_RESULT: ${{ steps.native-sql-drafts.outcome }}
          NATIVE_STATE: ${{ steps.native-sql-drafts.outputs.state }}
          FIRST_PGTAP_RESULT: ${{ steps.pgtap-first.outcome }}
          SECOND_PGTAP_RESULT: ${{ steps.pgtap-second.outcome }}
          NATIVE_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_SCOPE_REQUIRED: ${{ needs.collector-only-eligibility.outputs.native_database }}
        run: |
          export NATIVE_CHECKOUT_HEAD="$(git rev-parse HEAD)"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const expected = {"supabase/drafts/native-source-ledger-snapshot.sql":"08fc0baa0cf5f3776c91331218ca4cdf8e1ad41e688dc06c7363b5f85baec258","supabase/drafts/tests/native-source-ledger-snapshot.sql":"dd462f0b0777310f06793661d3e96d9b3b91f47e6606233600f2997968e6074b","supabase/drafts/native-purpose-authority-schema.sql":"976346877d4103d7f5c0ab14e560d2971370da4ebececd4dba909853c3fd3268","supabase/drafts/tests/native-purpose-authority-schema.sql":"381e50a775f2d93c0ae6b5757dedb38c3b9c834fe9aff8d8a21e824dd5b1a6fe","supabase/drafts/native-purpose-candidate-reader.sql":"84f2e7f54d484c7149237c15ede60df79ef688469da79c29e8b33ccc17ae75e2","supabase/drafts/tests/native-purpose-candidate-reader.sql":"c5256a58200ac8e3122add1b7b887868d1a8e195256dd97e13ea7e5c54840c25","supabase/drafts/tests/native-purpose-candidate-reader-correction.sql":"5c30190276057bb2d4875d0e6f2c5984b6ec6b0d381e77e40ade64682eb9d58e"};
          const requiredTests = ["supabase/tests/native_source_ledger_snapshot.sql","supabase/tests/native_purpose_authority_schema.sql","supabase/tests/native_purpose_candidate_reader.sql","supabase/tests/native_purpose_candidate_reader_correction.sql"];
          const env = process.env;
          const failures = [];
          const receipt = {
            schemaVersion: 1, nativeSqlOnly: true, fullQualification: 'pending',
            requestedHead: env.NATIVE_REQUESTED_HEAD, checkoutHead: env.NATIVE_CHECKOUT_HEAD,
            runId: env.GITHUB_RUN_ID, runAttempt: env.GITHUB_RUN_ATTEMPT, job: env.GITHUB_JOB,
            stagingResult: env.NATIVE_STAGE_RESULT, state: env.NATIVE_STATE,
            firstPgTapResult: env.FIRST_PGTAP_RESULT, secondPgTapResult: env.SECOND_PGTAP_RESULT,
            realConcurrency: 'UNRUN', canonicalPinnedRowCrossSessionFk: 'UNRUN',
          };
          for (const [label, actual, wanted] of [
            ['native staging outcome', env.NATIVE_STAGE_RESULT, 'success'],
            ['native staging state', env.NATIVE_STATE, 'ephemeral'],
            ['first pgTAP outcome', env.FIRST_PGTAP_RESULT, 'success'],
            ['second pgTAP outcome', env.SECOND_PGTAP_RESULT, 'success'],
          ]) if (actual !== wanted) failures.push(label + ': ' + (actual ?? 'missing'));
          try {
            if (env.NATIVE_SCOPE_REQUIRED === 'true' && env.NATIVE_CHECKOUT_HEAD !== env.NATIVE_REQUESTED_HEAD) throw Error('Native rehearsal must execute the exact requested head.');
            const stage = JSON.parse(readFileSync('.native-sql-rehearsal-stage.json', 'utf8'));
            if (stage.schemaVersion !== 1 || stage.state !== 'ephemeral' ||
                !/^[a-f0-9]{40}$/.test(env.NATIVE_REQUESTED_HEAD ?? '') ||
                !/^[a-f0-9]{40}$/.test(env.NATIVE_CHECKOUT_HEAD ?? '') ||
                stage.requestedHead !== env.NATIVE_REQUESTED_HEAD || stage.checkoutHead !== env.NATIVE_CHECKOUT_HEAD)
              throw Error('Native stage/checkout identity mismatch');
            if (!Array.isArray(stage.records) || stage.records.length !== 7 ||
                new Set(stage.records.map(row => row.source)).size !== 7 ||
                new Set(stage.records.map(row => row.path)).size !== 7)
              throw Error('Incomplete or duplicate native source/copy identities');
            let previousVersion = '';
            const tests = [];
            let migrations = 0;
            for (const row of stage.records) {
              if (!Object.hasOwn(expected, row.source) || expected[row.source] !== row.sha256)
                throw Error('Unreviewed native source identity/hash');
              if (row.kind === 'migration') {
                const name = row.source.slice('supabase/drafts/'.length).replaceAll('-', '_');
                if (row.source.startsWith('supabase/drafts/tests/') ||
                    !/^[0-9]{14}$/.test(row.version) || row.version <= previousVersion ||
                    row.path !== 'supabase/migrations/' + row.version + '_' + name)
                  throw Error('Unordered or registered native migration copy');
                previousVersion = row.version;
                migrations++;
              } else if (row.kind === 'test') {
                const target = 'supabase/tests/' + row.source.slice('supabase/drafts/tests/'.length).replaceAll('-', '_');
                if (!row.source.startsWith('supabase/drafts/tests/') || row.version !== '-' ||
                    row.path !== target || !requiredTests.includes(target))
                  throw Error('Undiscoverable native owning test');
                tests.push(target);
              } else throw Error('Unknown native source kind');
              for (const path of [row.source, row.path]) {
                if (createHash('sha256').update(readFileSync(path)).digest('hex') !== row.sha256)
                  throw Error('Native source/copy changed: ' + path);
              }
            }
            if (migrations !== 3 || tests.length !== 4 || requiredTests.some(path => !tests.includes(path)))
              throw Error('Missing native migration, closed-gate or private positive fixture');
            receipt.records = stage.records;
          } catch (error) { failures.push(error.message); }
          receipt.publicClosedGateEvidence = {
            test: 'supabase/tests/native_purpose_candidate_reader.sql',
            sha256: expected['supabase/drafts/tests/native-purpose-candidate-reader.sql'],
            status: failures.length ? 'unaccepted' : 'passed in both actual pgTAP steps',
          };
          receipt.privatePositiveFixtureEvidence = {
            test: 'supabase/tests/native_purpose_candidate_reader_correction.sql',
            sha256: expected['supabase/drafts/tests/native-purpose-candidate-reader-correction.sql'],
            status: failures.length ? 'unaccepted' : 'passed in both actual pgTAP steps',
            qualification: 'unreviewed/proposed/unbound synthetic candidate; no runtime authority',
          };
          receipt.gate = failures.length ? 'failed' : 'passed-native-sql-only';
          receipt.failures = failures;
          writeFileSync('native-sql-rehearsal-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          if (failures.length) { console.error(failures.join('\n')); process.exit(1); }
          console.log('Native closed-gate and private positive SQL fixtures passed both disposable pgTAP steps; concurrency and full qualification remain pending.');
          NODE

      - name: Retain native SQL acceptance or failure receipt
        if: always() && (needs.collector-only-eligibility.outputs.native_database == 'true' || steps.native-sql-drafts.outputs.state != 'absent')
        uses: actions/upload-artifact@v4
        with:
          name: native-sql-rehearsal-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-sql-rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Require both disposable pgTAP passes for native World commit
        if: always() && steps.native-world-sql-drafts.outputs.state != 'absent'
        env:
          WORLD_STAGE_RESULT: ${{ steps.native-world-sql-drafts.outcome }}
          WORLD_STATE: ${{ steps.native-world-sql-drafts.outputs.state }}
          WORLD_PREREQUISITE_RESULT: ${{ steps.native-sql-acceptance.outcome }}
          FIRST_PGTAP_RESULT: ${{ steps.pgtap-first.outcome }}
          SECOND_PGTAP_RESULT: ${{ steps.pgtap-second.outcome }}
          WORLD_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export WORLD_CHECKOUT_HEAD="$(git rev-parse HEAD)"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const env = process.env, failures = [];
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const expected = ['de039c9204ccb8fcefc659cdc090468ed3f8ae20d97fc18af96228e76897a4db', '561d43d6f1f2a6c26a66e7e050db7b196d209939f337d2c773951d23f031cc62'];
          const sources = ['supabase/drafts/native-world-reduction-commit.sql', 'supabase/drafts/tests/native-world-reduction-commit.sql'];
          const prefix = Buffer.from('\\set ON_ERROR_STOP on\n\\set world_disposable 1\n\\set world_role unit\n\\set world_case none\n');
          const receipt = {schemaVersion: 1, nativeWorldSqlOnly: true, fullQualification: 'pending',
            requestedHead: env.WORLD_REQUESTED_HEAD, checkoutHead: env.WORLD_CHECKOUT_HEAD,
            runId: env.GITHUB_RUN_ID, runAttempt: env.GITHUB_RUN_ATTEMPT, job: env.GITHUB_JOB,
            stagingResult: env.WORLD_STAGE_RESULT, state: env.WORLD_STATE, prerequisiteResult: env.WORLD_PREREQUISITE_RESULT,
            firstPgTapResult: env.FIRST_PGTAP_RESULT, secondPgTapResult: env.SECOND_PGTAP_RESULT,
            realConcurrency: 'UNRUN', canonicalPinnedRowCrossSessionFk: 'UNRUN', reservationExpiryCrossSession: 'UNRUN',
            concurrencyRequirement: 'Separate barrier-controlled psql sessions/job outside the rollback-only unit transaction; fresh disposable setup per case',
          };
          for (const [label, actual, wanted] of [
            ['World staging outcome', env.WORLD_STAGE_RESULT, 'success'], ['World staging state', env.WORLD_STATE, 'ephemeral'],
            ['native prerequisite acceptance', env.WORLD_PREREQUISITE_RESULT, 'success'],
            ['first pgTAP outcome', env.FIRST_PGTAP_RESULT, 'success'], ['second pgTAP outcome', env.SECOND_PGTAP_RESULT, 'success'],
          ]) if (actual !== wanted) failures.push(label + ': ' + (actual ?? 'missing'));
          try {
            if (!/^[a-f0-9]{40}$/.test(env.WORLD_REQUESTED_HEAD ?? '') || env.WORLD_CHECKOUT_HEAD !== env.WORLD_REQUESTED_HEAD)
              throw Error('World rehearsal must execute the exact requested head');
            const stage = JSON.parse(readFileSync('.native-world-sql-rehearsal-stage.json', 'utf8'));
            const prerequisiteBytes = readFileSync('.native-sql-rehearsal-stage.json');
            const prerequisite = JSON.parse(prerequisiteBytes);
            const accepted = JSON.parse(readFileSync('native-sql-rehearsal-receipt.json', 'utf8'));
            if (stage.schemaVersion !== 1 || stage.state !== 'ephemeral' || stage.requestedHead !== env.WORLD_REQUESTED_HEAD ||
                stage.checkoutHead !== env.WORLD_CHECKOUT_HEAD || hash(prerequisiteBytes) !== stage.prerequisiteStageSha256 ||
                prerequisite.schemaVersion !== 1 || prerequisite.state !== 'ephemeral' ||
                prerequisite.requestedHead !== stage.requestedHead || prerequisite.checkoutHead !== stage.checkoutHead ||
                prerequisite.records?.length !== 7 || accepted.gate !== 'passed-native-sql-only' ||
                accepted.requestedHead !== stage.requestedHead || accepted.checkoutHead !== stage.checkoutHead ||
                JSON.stringify(accepted.records) !== JSON.stringify(prerequisite.records) ||
                accepted.firstPgTapResult !== 'success' || accepted.secondPgTapResult !== 'success')
              throw Error('World/native prerequisite identity or acceptance mismatch');
            const lastVersion = prerequisite.records.filter(row => row.kind === 'migration').at(-1)?.version;
            if (!/^[0-9]{14}$/.test(lastVersion ?? '') || lastVersion !== stage.prerequisiteVersion)
              throw Error('World native prerequisite version mismatch');
            if (!Array.isArray(stage.records) || stage.records.length !== 2 ||
                new Set(stage.records.map(row => row.source)).size !== 2 || new Set(stage.records.map(row => row.path)).size !== 2)
              throw Error('Incomplete or duplicate World source/copy identities');
            for (const [i, row] of stage.records.entries()) {
              const target = i === 0 ? 'supabase/migrations/' + row.version + '_native_world_reduction_commit.sql'
                : 'supabase/tests/native_world_reduction_commit.sql';
              if (row.source !== sources[i] || row.sha256 !== expected[i] || row.path !== target ||
                  row.kind !== (i === 0 ? 'migration' : 'unit-test') ||
                  (i === 0 ? !/^[0-9]{14}$/.test(row.version) || row.version <= lastVersion : row.version !== '-') ||
                  row.copySha256 !== (i === 0 ? expected[0] : '04a09fc2de7f66193366f3002a31892bf60170c1252ccfe099ff55a6fa0ade5a'))
                throw Error('Unreviewed, unordered or undiscoverable World copy');
              const sourceBytes = readFileSync(row.source), copyBytes = readFileSync(row.path);
              if (hash(sourceBytes) !== row.sha256 || hash(copyBytes) !== row.copySha256 ||
                  !(i === 0 ? copyBytes.equals(sourceBytes) : copyBytes.equals(Buffer.concat([prefix, sourceBytes]))))
                throw Error('World source/copy/preamble changed');
            }
            receipt.records = stage.records;
            receipt.prerequisiteStageSha256 = stage.prerequisiteStageSha256;
          } catch (error) { failures.push(error.message); }
          const evidence = {test: 'supabase/tests/native_world_reduction_commit.sql', payloadSha256: expected[1],
            copySha256: '04a09fc2de7f66193366f3002a31892bf60170c1252ccfe099ff55a6fa0ade5a', status: failures.length ? 'unaccepted' : 'passed in both actual pgTAP steps'};
          receipt.publicClosedGateEvidence = {...evidence, assertions: ['public gate stays false', 'public function closed'],
            qualification: 'Production gate remains disabled; no runtime authority granted'};
          receipt.privateVerifierDoubleEvidence = {...evidence, qualification:
            'Owner-only synthetic gate-open function copy and fake verifier; no scanner/CDR/producer/issuer/Core qualification or production verifier implementation'};
          receipt.gate = failures.length ? 'failed' : 'passed-native-world-unit-sql-only';
          receipt.failures = failures;
          writeFileSync('native-world-sql-rehearsal-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          if (failures.length) { console.error(failures.join('\n')); process.exit(1); }
          console.log('World rollback-only unit fixture passed both disposable pgTAP steps; cross-session races and full qualification remain UNRUN/pending.');
          NODE

      - name: Retain native World SQL acceptance or failure receipt
        if: always() && steps.native-world-sql-drafts.outputs.state != 'absent'
        uses: actions/upload-artifact@v4
        with:
          name: native-world-sql-rehearsal-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-world-sql-rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 30

      # Last on purpose: the race commits synthetic budgets, reservations and append-only ledger
      # rows it cannot remove, so it must follow every pgTAP pass. Loopback, port and password do
      # not prove the target is disposable, so this step writes a fresh random marker into the
      # stack `supabase status` names, and the script refuses to write unless its own connection
      # finds that marker. psql is the runner's /usr/bin/psql, pinned inside the script.
      - name: Race model-provider settlement against another tenant's reserve on the disposable database
        env:
          MODEL_PROVIDER_SPEND_RACE_TEST: "1"
          PGPORT: "54322"
          PGPASSWORD: postgres
        run: |
          eval "$(supabase status --output env | grep '^DB_URL=')"
          marker="tavonel-disposable-$(cat /proc/sys/kernel/random/uuid)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "create schema tavonel_ci_fixture;" \
            -c "create table tavonel_ci_fixture.disposable_marker (value text primary key);" \
            -c "insert into tavonel_ci_fixture.disposable_marker values ('$marker');"
          MODEL_PROVIDER_SPEND_RACE_MARKER="$marker" node nextjs/scripts/db/model-provider-spend-race.mjs

      - name: Require both disposable pgTAP passes for the completed-read draft
        if: always() && steps.completed-read-draft.outputs.state != 'absent'
        env:
          COMPLETED_READ_STAGE_RESULT: ${{ steps.completed-read-draft.outcome }}
          COMPLETED_READ_STATE: ${{ steps.completed-read-draft.outputs.state }}
          FIRST_PGTAP_RESULT: ${{ steps.pgtap-first.outcome }}
          SECOND_PGTAP_RESULT: ${{ steps.pgtap-second.outcome }}
        run: node nextjs/scripts/repair-scope-gate.mjs database-draft
      - name: Stop only the runner's disposable local stack
        if: always()
        run: supabase stop --no-backup

  real-auth-journey:
    name: Real local Auth journey
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      # Same hypothesis-driven ephemeral-port exclusion as db-rehearsal (see there);
      # `supabase start` binds 54321-54329.
      - name: Keep the local stack ports out of this runner's ephemeral range
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          key=/proc/sys/net/ipv4/ip_local_reserved_ports
          before="$(cat "$key")"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${before:+$before,}54320-54329"
          after="$(cat "$key")"
          echo "reserved before='$before' after='$after'"
          covered() { echo "$after" | tr ',' '\n' | awk -F- -v p="$1" 'NF { hi = ($2 == "" ? $1 : $2); if (p >= $1 && p <= hi) f = 1 } END { exit !f }'; }
          for port in $(seq 54320 54329) $(echo "$before" | tr ',-' '  '); do covered "$port"; done
          ss -Htanp '( sport >= :54320 and sport <= :54329 )' || true
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Use official Docker Hub images for this disposable stack
        run: echo 'SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io' >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the existing frozen Foundation dependencies
        working-directory: nextjs
        run: pnpm install --frozen-lockfile
      - name: Preserve the existing Foundation validation gates
        working-directory: nextjs
        run: |
          pnpm scan:secrets
          pnpm check
          pnpm test
          node --test scripts/journey/real-auth-ci-contract.test.mjs scripts/journey/stop-owned-child.test.mjs
      - name: Start genuine Auth in the disposable local Supabase stack
        run: |
          test ! -f supabase/config.toml
          supabase init
          grep -qx 'major_version = 17' supabase/config.toml
          # Only this newly created runner-local configuration changes. No project is linked.
          python3 - <<'PY'
          from pathlib import Path
          import re
          config = Path('supabase/config.toml')
          original = config.read_text()
          updated, count = re.subn(r'^jwt_expiry = [0-9]+$', 'jwt_expiry = 60', original, flags=re.M)
          assert count == 1, 'Expected the pinned CLI default Auth lifetime field'
          config.write_text(updated)
          PY
          ss -Htanp '( sport >= :54320 and sport <= :54329 )' || true
          supabase start
          supabase status --output json > "$RUNNER_TEMP/tavonel-auth-status.json"
          chmod 600 "$RUNNER_TEMP/tavonel-auth-status.json"
      - name: Fetch only the official checksum-qualified portable local S3 runtime
        run: |
          mkdir -p "$RUNNER_TEMP/tavonel-auth-runtime"
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/seaweedfs/seaweedfs/releases/download/4.48/linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/tavonel-auth-runtime/release.tar.gz"
          echo "4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124  $RUNNER_TEMP/tavonel-auth-runtime/release.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tavonel-auth-runtime/release.tar.gz" -C "$RUNNER_TEMP/tavonel-auth-runtime" weed
          echo "8c07a1ccc4ec058cd90989ac0533c30436832e41c63de2b26f37253d9f744c4d  $RUNNER_TEMP/tavonel-auth-runtime/weed" | sha256sum --check
          chmod +x "$RUNNER_TEMP/tavonel-auth-runtime/weed"
      - name: Install one isolated Chromium runtime
        working-directory: nextjs
        run: pnpm exec playwright install --with-deps chromium
      - name: Qualify real provider login, interrupted callback, refresh, logout and selected-revision UI
        working-directory: nextjs
        run: |
          export TAVONEL_AUTH_STACK_STATUS="$RUNNER_TEMP/tavonel-auth-status.json"
          export TAVONEL_LOCAL_SEAWEED_EXE="$RUNNER_TEMP/tavonel-auth-runtime/weed"
          node scripts/journey/real-auth-ci-journey.mjs
      - name: Preserve only the redacted qualification ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-auth-journey-${{ github.sha }}
          path: nextjs/output/real-auth-journey.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop only the runner's disposable local stack
        if: always()
        run: |
          supabase stop --no-backup
          rm -f "$RUNNER_TEMP/tavonel-auth-status.json"

  affected-db-rehearsal:
    name: Affected SQL fixtures on the current disposable migration chain
    needs: [collector-only-eligibility]
    if: needs.collector-only-eligibility.result == 'success' && needs.collector-only-eligibility.outputs.affected == 'true' && needs.collector-only-eligibility.outputs.affected_database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
      AFFECTED_REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      AFFECTED_DATABASE_TESTS: ${{ needs.collector-only-eligibility.outputs.affected_database_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Use official Docker Hub image for the disposable stack
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"
      - name: Revalidate exact head and selected fixture plan
        env:
          REPAIR_HEAD_SHA: ${{ env.AFFECTED_REQUESTED_HEAD }}
          EXPECTED_AFFECTED_DATABASE_TESTS: ${{ env.AFFECTED_DATABASE_TESTS }}
        run: |
          test "$(git rev-parse HEAD)" = "$AFFECTED_REQUESTED_HEAD"
          test -n "$AFFECTED_DATABASE_TESTS"
          node --input-type=module <<'NODE'
          import { classifyAffectedIntent, verifyAffectedSource } from './nextjs/scripts/repair-collector-only.mjs';
          const head=process.env.REPAIR_HEAD_SHA,intent=classifyAffectedIntent({headSha:head}),proof=verifyAffectedSource({headSha:head,intent});
          if(!proof.eligible)throw Error('Affected source/map revalidation failed: '+proof.reason);
          if(proof.map.databaseTests.join(',')!==process.env.EXPECTED_AFFECTED_DATABASE_TESTS)throw Error('Affected SQL fixture list changed after classifier admission.');
          if(!proof.map.databaseChanged)throw Error('Affected SQL plan no longer requires a fresh DB lane.');
          NODE
          case ",$AFFECTED_DATABASE_TESTS," in
            *,supabase/tests/google_viewer_principal_boundary.sql,*) test -f supabase/drafts/google-viewer-principal-boundary.sql; test -f supabase/tests/google_viewer_principal_boundary.sql ;;
          esac
          case ",$AFFECTED_DATABASE_TESTS," in
            *,supabase/tests/dropbox_source_reconciliation.sql,*) test -f supabase/tests/dropbox_source_reconciliation.sql; test -f supabase/migrations/20261007100000_dropbox_source_path_reconciliation.sql ;;
          esac
      - name: Create local Postgres 17 config
        run: |
          test -f supabase/config.toml || supabase init
          grep -qx 'major_version = 17' supabase/config.toml
      - name: Stage the ACL draft once when its fixture is selected
        if: contains(needs.collector-only-eligibility.outputs.affected_database_tests, 'google_viewer_principal_boundary.sql')
        run: |
          shopt -s nullglob
          existing=(supabase/migrations/*_google_viewer_principal_boundary.sql)
          if ((${#existing[@]} == 0)); then
            supabase migration new google_viewer_principal_boundary
            generated=(supabase/migrations/*_google_viewer_principal_boundary.sql)
            test "${#generated[@]}" -eq 1
            cp -- supabase/drafts/google-viewer-principal-boundary.sql "${generated[0]}"
            cmp -- supabase/drafts/google-viewer-principal-boundary.sql "${generated[0]}"
          else
            test "${#existing[@]}" -eq 1
          fi
      - name: Apply the complete current migration chain once to an empty database
        run: |
          test "$(git rev-parse HEAD)" = "$AFFECTED_REQUESTED_HEAD"
          supabase db start
          supabase migration list --local
      - name: Run only the database fixtures selected by the affected plan
        run: |
          set -euo pipefail
          supabase db query --local "create extension if not exists pgtap with schema extensions;"
          selected="$RUNNER_TEMP/tavonel-affected-pgtap-selected"
          moved="$RUNNER_TEMP/tavonel-affected-pgtap-unselected"
          mkdir -p "$selected" "$moved"
          restore_tests() { find "$moved" -type f -name '*.sql' -print0 | while IFS= read -r -d '' file; do rel="${file#"$moved"/}"; mkdir -p "supabase/tests/$(dirname "$rel")"; mv -- "$file" "supabase/tests/$rel"; done; }
          trap restore_tests EXIT
          IFS=',' read -r -a tests <<< "$AFFECTED_DATABASE_TESTS"
          ((${#tests[@]} > 0))
          for path in "${tests[@]}"; do test -f "$path"; cp -- "$path" "$selected/$(basename "$path")"; done
          while IFS= read -r -d '' file; do
            keep=false
            for path in "${tests[@]}"; do [[ "$file" == "$path" ]] && keep=true && break; done
            if [[ "$keep" == false ]]; then rel="${file#supabase/tests/}"; mkdir -p "$moved/$(dirname "$rel")"; mv -- "$file" "$moved/$rel"; fi
          done < <(find supabase/tests -type f -name '*.sql' -print0)
          for path in "${tests[@]}"; do test -f "$path"; done
          supabase test db
          receipt="$RUNNER_TEMP/affected-db-rehearsal.json"
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.argv[1],JSON.stringify({schemaVersion:1,requestedHead:process.env.AFFECTED_REQUESTED_HEAD,checkoutHead:require("node:child_process").execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),runId:process.env.GITHUB_RUN_ID,job:process.env.GITHUB_JOB,fixtures:process.env.AFFECTED_DATABASE_TESTS.split(","),migrationChain:"complete current checkout applied once from empty via supabase db start",selectedFixtureResult:"success",fullQualification:"pending"},null,2)+"\n")' "$receipt"
          cp "$receipt" affected-db-rehearsal.json
      - name: Observe Dropbox canonical and generic job exclusion when selected
        if: contains(needs.collector-only-eligibility.outputs.affected_database_tests, 'dropbox_source_reconciliation.sql')
        timeout-minutes: 2
        run: node nextjs/scripts/db/dropbox-source-stream-race.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affected-db-rehearsal-${{ github.event.pull_request.head.sha || github.sha }}
          path: affected-db-rehearsal.json
          if-no-files-found: error
          retention-days: 30
      - name: Stop only the runner's disposable local stack
        if: always()
        run: supabase stop --no-backup

  # On Windows, actual Chromium + SeaweedFS 4.48 left both valid signed PUTs hanging and the S3
  # gateway never reported ready, so the transport is unqualified there. This proposes Linux as the
  # runner; a log here is the evidence, not this comment. Loopback only: no Supabase stack, no
  # secret, no database credentials. The harness creates its own disposable keys and S3.
  browser-storage-transport:
    name: Local Chromium signed-storage transport
    needs: [collector-only-eligibility]
    if: always() && github.event_name == 'pull_request' && needs.collector-only-eligibility.result == 'success' && needs.collector-only-eligibility.outputs.affected != 'true' && needs.collector-only-eligibility.outputs.intended == 'false' && needs.collector-only-eligibility.outputs.eligible == 'false' && needs.collector-only-eligibility.outputs.native_database == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the existing frozen Foundation dependencies
        working-directory: nextjs
        run: pnpm install --frozen-lockfile
      - name: Install one isolated Chromium runtime
        working-directory: nextjs
        run: pnpm exec playwright install --with-deps chromium
      - name: Fetch only the official checksum-qualified portable local S3 runtime
        run: |
          mkdir -p "$RUNNER_TEMP/tavonel-transport-runtime"
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/seaweedfs/seaweedfs/releases/download/4.48/linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/tavonel-transport-runtime/release.tar.gz"
          echo "4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124  $RUNNER_TEMP/tavonel-transport-runtime/release.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tavonel-transport-runtime/release.tar.gz" -C "$RUNNER_TEMP/tavonel-transport-runtime" weed
          echo "8c07a1ccc4ec058cd90989ac0533c30436832e41c63de2b26f37253d9f744c4d  $RUNNER_TEMP/tavonel-transport-runtime/weed" | sha256sum --check
          chmod +x "$RUNNER_TEMP/tavonel-transport-runtime/weed"
      - name: Qualify actual Chromium signed PUT, CORS, refusal, redirect and host guards against actual local S3
        working-directory: nextjs
        # Disposable SeaweedFS data and TLS fixtures on the runner's temp area (SeaweedFS needs >=1% free there).
        env:
          TAVONEL_LOCAL_S3_TMPDIR: ${{ runner.temp }}
        run: |
          export TAVONEL_LOCAL_SEAWEED_EXE="$RUNNER_TEMP/tavonel-transport-runtime/weed"
          node scripts/journey/local-browser-storage-transport-journey.mjs
