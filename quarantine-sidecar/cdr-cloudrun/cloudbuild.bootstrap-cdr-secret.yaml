# One-shot bootstrap for the independent TAVONEL PDF-raster CDR HMAC.
#
# Invocation is manual and must remain a separately approved operation. This file
# intentionally does NOT run during normal Cloud Run source deployment, does not
# read an existing secret value, and never writes random bytes to Cloud Build logs.
#
# The secret is user-managed replicated in Seoul (asia-northeast3). It is intended
# only for the Cloud Run runtime's TAVONEL_CDR_HMAC secret reference. Do not put
# the value in source, substitutions, build arguments, environment variables, or
# command-line arguments.

steps:
  - id: create-cdr-hmac-if-absent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        secret_name='tavonel-cdr-hmac'
        project_id='tavonel-saas-foundation'

        if gcloud secrets describe "${secret_name}" --project="${project_id}" >/dev/null 2>&1; then
          printf 'TAVONEL_CDR_HMAC_EXISTS\n'
          exit 0
        fi

        # 48 random bytes encode to a 64-character base64url HMAC, with no newline.
        # The pipeline is passed directly to Secret Manager and its payload is never
        # written to stdout/stderr or to a filesystem path in the build worker.
        head -c 48 /dev/urandom | base64 | tr '+/' '-_' | tr -d '\n' | \
          gcloud secrets create "${secret_name}" \
            --project="${project_id}" \
            --replication-policy=user-managed \
            --locations=asia-northeast3 \
            --data-file=- \
            --labels=system=tavonel,component=cdr,scope=synthetic \
            >/dev/null

        printf 'TAVONEL_CDR_HMAC_CREATED\n'

options:
  logging: CLOUD_LOGGING_ONLY

# No artifacts, substitutions, or secret environment variables are declared.
# The operation is intentionally idempotent and is not a CDR qualification test.
