<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The logomark (LOCUS, components/logomark.tsx), on the tab tile.

    Same geometry as the nav mark, scaled 24 -> 32 (x 4/3) and then 1.12 about the tile centre so
    the glyph fills the tile rather than floating in it (chrome-15). A tab renders this at 16px, so
    the two strokes go a little heavier than the nav's 2.5 / 2.0: 3.3 / 2.7 before the scale.

    BQ-131: one ink in both places. The tab and the nav mark both take --text-mid (#9AA3A8), so the
    two never read as two slightly different greys.
  -->
  <rect width="32" height="32" rx="6" fill="#08090A"/>
  <g fill="none" stroke="#9AA3A8" stroke-linecap="square" transform="translate(16 16) scale(1.12) translate(-16 -16)">
    <path d="M6 4.7H19.3L26 9.3V27.3H6Z" stroke-width="3.3"/>
    <path d="M12.7 16V21.3H20" stroke-width="2.7"/>
  </g>
</svg>
