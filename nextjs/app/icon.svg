<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The logomark, redrawn for 16px.

    The component version draws the eight unlit cells as hollow strokes at 0.42 opacity, which is
    right at nav size and disappears entirely in a browser tab. Here every cell is filled and the
    contrast is carried by fill alone, so the one lit cell still reads at favicon scale.
  -->
  <rect width="32" height="32" rx="6" fill="#08090A"/>
  <g fill="#697278">
    <rect x="6"  y="6"  width="6" height="6" rx="1"/>
    <rect x="13" y="6"  width="6" height="6" rx="1"/>
    <rect x="20" y="6"  width="6" height="6" rx="1"/>
    <rect x="6"  y="13" width="6" height="6" rx="1"/>
    <rect x="20" y="13" width="6" height="6" rx="1"/>
    <rect x="6"  y="20" width="6" height="6" rx="1"/>
    <rect x="13" y="20" width="6" height="6" rx="1"/>
    <rect x="20" y="20" width="6" height="6" rx="1"/>
  </g>
  <rect x="13" y="13" width="6" height="6" rx="1" fill="#7BE0BE"/>
</svg>
