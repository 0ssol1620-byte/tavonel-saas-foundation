<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The logomark, redrawn for 16px.

    Decision A-06's geometry from components/logomark.tsx, scaled 24 -> 32 and drawn a little
    heavier: a tab favicon is rendered at 16px, so the two pages take 2.5 and the thread 2.1
    rather than the 1.9 / 1.6 the nav uses, and the contrast is carried by one light neutral on
    the dark ground instead of by opacity.
  -->
  <rect width="32" height="32" rx="6" fill="#08090A"/>
  <g fill="none" stroke="#C8CED2" stroke-linecap="square">
    <path d="M3.3 7.3H9.9L12.7 10.1V24.7H3.3Z" stroke-width="2.5" opacity="0.72"/>
    <path d="M19.3 10.9H28.7V24.7H19.3Z" stroke-width="2.5" opacity="0.72"/>
    <path d="M12.7 20.7L19.3 16.1" stroke-width="2.1"/>
  </g>
</svg>
